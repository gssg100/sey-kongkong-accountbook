    function editRecurring(id) {
      const rec = (STATE.recurrings||[]).find(r => String(r.id) === String(id));
      if(!rec) return;
      STATE.editingRecurring = rec;
      document.getElementById('rId').value = rec.id;
      document.getElementById('rDay').value = rec.day || '';
      document.getElementById('rAmount').value = comma(rec.amount || 0);
      document.getElementById('rDesc').value = rec.name || '';
      document.getElementById('rEnabled').checked = rec.enabled !== false;
      
      if (rec.endYm) {
        document.getElementById('rEndYmToggle').checked = true;
        document.getElementById('rEndYmContainer').style.display = 'flex';
        document.getElementById('rEndYm').value = rec.endYm;
      } else {
        document.getElementById('rEndYmToggle').checked = false;
        document.getElementById('rEndYmContainer').style.display = 'none';
        document.getElementById('rEndYm').value = '';
      }
      
      STATE.form.rType = rec.type || '지출';
      STATE.form.rCat = rec.cat || '';
      openRecurringModal();
    }

    function deleteRecurring() {
      if(!confirm('이 고정거래를 삭제하시겠습니까?')) return;
      const id = document.getElementById('rId').value;
      closeRecurringModal();
      toast('🔄 삭제 중...');
      api('deleteRecurring', id).then(res => {
        STATE.recurrings = res.recurrings;
        renderRecurring();
        renderHome();
        toast('✅ 삭제 완료');
      }).catch(e => {
        toast('⚠️ 삭제 실패', true);
      });
    }
    // ===== 일괄 편집 제어 로직 =====
    STATE.bulkMode = false;
    STATE.bulkSelection = new Set();
    STATE.bulkTargetCat = '';

    function toggleBulkMode() {
      STATE.bulkMode = !STATE.bulkMode;
      if (!STATE.bulkMode && STATE.bulkSelection) STATE.bulkSelection.clear();
      renderList();
    }

    function toggleBulkSelect(row, isChecked) {
      if (!STATE.bulkSelection) STATE.bulkSelection = new Set();
      if (isChecked) STATE.bulkSelection.add(String(row));
      else STATE.bulkSelection.delete(String(row));
      renderList();
    }

    // ===== 자산 편집 제어 로직 =====
    STATE.assetEditKey = '';
    STATE.assetEditTemp = [];
    
    function openAssetEditModal(key, label) {
      rememberDialogTrigger();
      STATE.assetEditKey = key;
      const items = (STATE.assets.items[key] || {}).subItems || [];
      STATE.assetEditTemp = JSON.parse(JSON.stringify(items));
      if (STATE.assetEditTemp.length === 0) STATE.assetEditTemp.push({name: '', amount: 0});
      
      document.getElementById('overlay').classList.add('on');
      document.getElementById('assetEditSheet').classList.add('on');
      
      const labelEl = document.getElementById('assetEditSheetLabel');
      if(labelEl) labelEl.textContent = label + ' 세부 항목';
      
      const titleEl = document.getElementById('assetEditSheetTitle');
      if(titleEl) titleEl.textContent = '자산 금액 변경';
      
      renderAssetEditList();
    }
    
    function renderAssetEditList() {
      const container = document.getElementById('assetSubItemsContainer');
      if (!container) return;
      
      let html = '';
      let total = 0;
      STATE.assetEditTemp.forEach((item, idx) => {
        total += Number(item.amount) || 0;
        html += `
          <div style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
            <input type="text" class="in-text" value="${item.name}" placeholder="항목명" oninput="STATE.assetEditTemp[${idx}].name=this.value" style="flex:1;">
            <input type="text" class="in-text" value="${item.amount?item.amount.toLocaleString('en-US'):''}" placeholder="금액" oninput="updateAssetSubItemAmt(${idx}, this)" style="flex:1;">
            <button class="btn" style="background:var(--expense); color:#fff; padding:0 12px; height:48px;" onclick="removeAssetSubItem(${idx})">✕</button>
          </div>
        `;
      });
      container.innerHTML = html;
      
      const totalEl = document.getElementById('assetEditTotalVal');
      if (totalEl) totalEl.textContent = total.toLocaleString('en-US');
    }
    
    window.updateAssetSubItemAmt = function(idx, el) {
      const raw = el.value.replace(/[^0-9]/g, '');
      if (!raw) {
        STATE.assetEditTemp[idx].amount = 0;
        el.value = '';
      } else {
        const num = Number(raw);
        STATE.assetEditTemp[idx].amount = num;
        el.value = num.toLocaleString('en-US');
      }
      
      let total = 0;
      STATE.assetEditTemp.forEach(item => { total += item.amount || 0; });
      const totalEl = document.getElementById('assetEditTotalVal');
      if (totalEl) totalEl.textContent = total.toLocaleString('en-US');
    };
    
    window.addAssetSubItem = function() {
      STATE.assetEditTemp.push({name: '', amount: 0});
      renderAssetEditList();
    };
    
    window.removeAssetSubItem = function(idx) {
      STATE.assetEditTemp.splice(idx, 1);
      renderAssetEditList();
    };

    function closeAssetEditModal() {
      document.getElementById('overlay').classList.remove('on');
      document.getElementById('assetEditSheet').classList.remove('on');
      restoreDialogTrigger();
    }

    function submitAssetEdit() {
      const key = STATE.assetEditKey;
      // Filter out empty items
      const validItems = STATE.assetEditTemp.filter(i => i.name.trim() !== '' || i.amount > 0);
      
      closeAssetEditModal();
      toast('🔄 자산 업데이트 중...');
      
      api('updateAssetCategory', key, validItems).then(res => {
        if(res.ok) {
          STATE.assets = res.assets;
          renderAsset();
          toast('✅ 자산 업데이트 완료!');
        } else {
          toast('⚠️ 업데이트 실패', true);
        }
      }).catch(e => {
        toast('⚠️ 오류 발생: ' + e.message, true);
      });
    }

    function openBulkCatModal() {
      if (!STATE.bulkSelection || STATE.bulkSelection.size === 0) return toast('선택된 항목이 없습니다.');
      rememberDialogTrigger();
      document.getElementById('overlay').classList.add('on');
      document.getElementById('bulkCatSheet').classList.add('on');
      
      const cats = ['식비', '교통/차량', '주거/통신', '쇼핑/문화', '경조/이벤트', '용돈', '기타', '월급', '부수입'];
      STATE.bulkTargetCat = cats[0];
      
      const renderChips = () => {
        document.getElementById('bulkCatChips').innerHTML = cats.map(c=>
          `<button type="button" class="chip ${STATE.bulkTargetCat===c?'on':''}" onclick="STATE.bulkTargetCat='${c}'; document.getElementById('bulkCatChips').innerHTML=''">
             ${emo(c)} ${c}
           </button>`
        ).join('');
        // Re-bind click via a tiny hack or just use a simpler approach
      };
      
      // Better approach for chips
      window.selectBulkCat = function(c) {
        STATE.bulkTargetCat = c;
        document.getElementById('bulkCatChips').innerHTML = cats.map(cat=>
          `<button type="button" class="chip ${STATE.bulkTargetCat===cat?'on':''}" onclick="selectBulkCat('${cat}')">${emo(cat)} ${cat}</button>`
        ).join('');
      };
      selectBulkCat(STATE.bulkTargetCat);
    }

    function closeBulkCatModal() {
      document.getElementById('overlay').classList.remove('on');
      document.getElementById('bulkCatSheet').classList.remove('on');
      restoreDialogTrigger();
    }

    function submitBulkCat() {
      const ids = Array.from(STATE.bulkSelection);
      const newCat = STATE.bulkTargetCat;
      if(!newCat) return toast('카테고리를 선택하세요.', true);
      
      closeBulkCatModal();
      toast('🔄 변경 및 학습 중...');
      api('bulkUpdateCategory', { ids: ids, newCat: newCat, ym: STATE.ym }).then(res => {
        STATE.bulkMode = false;
        STATE.bulkSelection.clear();
        STATE.recent = res.transactions;
        STATE.transactions = res.transactions;
        if(res.descDict) STATE.descDict = res.descDict;
        renderAll();
        toast('✅ 변경 및 자동분류 학습 완료!');
      }).catch(e => {
        toast('⚠️ 일괄 변경 실패: ' + e.message, true);
      });
    }

    // ===== 🤖 AI 분석 트리거 로직 =====
    function triggerAiAnalysis() {
      const btn = document.getElementById('runAiBtn');
      if(btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> AI 분석 진행 중...'; }
      toast('🤖 Groq AI로 소비 패턴을 분석하고 있어...');
      
      api('runAiAnalysis', STATE.ym).then(res => {
        if(res) {
          if(!STATE.aiHistory) STATE.aiHistory = [];
          const newAi = {
            when: todayStr(),
            ym: STATE.ym,
            coaching: (res && (res.coaching || res.analysis)) || String(res)
          };
          STATE.aiHistory.unshift(newAi);
          renderAi();
          toast('✨ AI 소비 분석이 완료되었어!');
        }
      }).catch(err => {
        toast((err && err.message) || 'AI 분석 실패', true);
        if(btn) { btn.disabled = false; btn.innerHTML = '<span>🤖 이번 달 소비 AI 분석 받기</span>'; }
      });
    }

    // ===== 📋 월정리 & 회고 저장 로직 =====
    function submitMonthlyReview() {
      const good = (document.getElementById('revGood') || {}).value || '';
      const regret = (document.getElementById('revRegret') || {}).value || '';
      const promise = (document.getElementById('revPromise') || {}).value || '';
      const jisoo = (document.getElementById('revJisoo') || {}).value || '';
      const hayoung = (document.getElementById('revHayoung') || {}).value || '';

      const reviewData = {
        ym: STATE.ym,
        goodSpending: good,
        regretSpending: regret,
        promiseNext: promise,
        jisooComment: jisoo,
        hayoungComment: hayoung,
        hakongComment: hayoung,
        user: STATE.form.user || '하콩'
      };

      const btn = document.getElementById('saveReviewBtn');
      if(btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
      toast('💾 부부 회고 저장 중...');

      api('saveMonthlyReview', reviewData).then(res => {
        if (res && Array.isArray(res.history)) STATE.closeHistory = res.history;
        else {
          if(!STATE.closeHistory) STATE.closeHistory = [];
          const idx = STATE.closeHistory.findIndex(h => h.ym === STATE.ym);
          if(idx > -1) STATE.closeHistory[idx] = { ...STATE.closeHistory[idx], ...reviewData };
          else STATE.closeHistory.unshift(reviewData);
        }
        
        renderReview();
        toast('✅ 이번 달 부부 회고가 저장되었어! 👏');
      }).catch(err => {
        toast((err && err.message) || '회고 저장 실패', true);
        if(btn) { btn.disabled = false; btn.textContent = '💾 이번 달 회고 저장하기'; }
      });
    }

    // ===== 🎯 예산 관리 제어 로직 =====
    function openBudgetModal() {
      rememberDialogTrigger();
      document.getElementById('overlay').classList.add('on');
      document.getElementById('budgetSheet').classList.add('on');
      
      const rows = (STATE.budget && (STATE.budget.rows || STATE.budget.items)) || [];
      renderBudgetItems(rows);
    }

    function closeBudgetModal() {
      document.getElementById('overlay').classList.remove('on');
      document.getElementById('budgetSheet').classList.remove('on');
      restoreDialogTrigger();
    }

    window.handleBudgetInput = function(inp) {
      const raw = inp.value.replace(/[^0-9]/g, '');
      inp.value = raw ? Number(raw).toLocaleString('en-US') : '';
      
      let total = 0;
      document.querySelectorAll('.budget-edit-inp').forEach(i => {
        total += Number(i.value.replace(/[^0-9]/g, '')) || 0;
      });
      const totalEl = document.getElementById('budgetTotalVal');
      if(totalEl) totalEl.textContent = '₩' + total.toLocaleString('en-US');
    };

    function applyRecommendBudget() {
      toast('💡 과거 소비 데이터 분석 중...');
      api('recommendBudget', STATE.ym).then(res => {
        const items = (res && res.items) || [];
        if(items.length) {
          renderBudgetItems(items.map(item => ({ category:item.category, budget:item.recommended || item.currentBudget || 0 })));
          toast('✨ AI 추천 예산이 반영되었어!');
        } else {
          toast('추천할 이전 지출 데이터가 충분하지 않아.');
        }
      }).catch(err => {
        toast('추천 실패: ' + err.message, true);
      });
    }

    function copyPreviousBudget() {
      toast('📋 전월 예산 불러오는 중...');
      const parts = String(STATE.ym || '').split('-');
      let year = Number(parts[0]), month = Number(parts[1]) - 1;
      if (month < 1) { year--; month = 12; }
      const previousYm = year + '-' + pad(month);
      const copy = overwrite => api('copyBudget', previousYm, STATE.ym, { user:STATE.sessionUser || '하콩', source:'예산 화면 전월 복사', overwrite:!!overwrite });
      copy(false).then(res => {
        if (res && res.needsOverwrite) {
          if (!confirm(STATE.ym+'에 이미 저장된 예산이 있어. 전월 예산으로 덮어쓸까?')) return null;
          return copy(true);
        }
        return res;
      }).then(res => {
        if (!res) return;
        if (res.skipped) return toast(res.message || '복사할 전월 예산이 없어.', true);
        if (res.budget) {
          STATE.budget = res.budget;
          renderBudgetItems(res.budget.items || res.budget.rows || []);
          toast('✅ '+previousYm+' 예산을 가져왔어!');
        }
      }).catch(err => {
        toast('복사 실패: ' + err.message, true);
      });
    }

    function submitBudget() {
      const items = [];
      document.querySelectorAll('.budget-edit-inp').forEach(inp => {
        const cat = inp.dataset.cat;
        const val = Number(inp.value.replace(/[^0-9]/g, '')) || 0;
        if(cat && val > 0) {
          items.push({ category: cat, budget: val });
        }
      });

      closeBudgetModal();
      toast('🎯 예산 저장 중...');
      api('updateBudget', STATE.ym, items, { user: STATE.form.user || '하콩' }).then(res => {
        STATE.budget = res;
        renderHome();
        toast('✅ 예산이 성공적으로 저장되었어!');
      }).catch(err => {
        toast('예산 저장 실패: ' + err.message, true);
      });
    }

function bindApp(){
  document.querySelectorAll('.tab[data-view]').forEach(t=>
    t.addEventListener('click', ()=>switchView(t.dataset.view)));

  const recSheetX = document.getElementById('recSheetX');
  if(recSheetX) recSheetX.addEventListener('click', closeRecurringModal);
  const recCancelBtn = document.getElementById('recCancelBtn');
  if(recCancelBtn) recCancelBtn.addEventListener('click', closeRecurringModal);
  const recSubmitBtn = document.getElementById('recSubmitBtn');
  if(recSubmitBtn) recSubmitBtn.addEventListener('click', submitRecurring);
  const recDeleteBtn = document.getElementById('recDeleteBtn');
  if(recDeleteBtn) recDeleteBtn.addEventListener('click', deleteRecurring);

  const bulkCatSheetX = document.getElementById('bulkCatSheetX');
  if(bulkCatSheetX) bulkCatSheetX.addEventListener('click', closeBulkCatModal);
  const bulkCatSubmitBtn = document.getElementById('bulkCatSubmitBtn');
  if(bulkCatSubmitBtn) bulkCatSubmitBtn.addEventListener('click', submitBulkCat);
  
  const assetEditSheetX = document.getElementById('assetEditSheetX');
  if(assetEditSheetX) assetEditSheetX.addEventListener('click', closeAssetEditModal);
  const assetEditSubmitBtn = document.getElementById('assetEditSubmitBtn');
  if(assetEditSubmitBtn) assetEditSubmitBtn.addEventListener('click', submitAssetEdit);
  const addAssetSubItemBtn = document.getElementById('addAssetSubItemBtn');
  if(addAssetSubItemBtn) addAssetSubItemBtn.addEventListener('click', addAssetSubItem);

  const budgetSheetX = document.getElementById('budgetSheetX');
  if(budgetSheetX) budgetSheetX.addEventListener('click', closeBudgetModal);
  const budgetRecBtn = document.getElementById('budgetRecBtn');
  if(budgetRecBtn) budgetRecBtn.addEventListener('click', applyRecommendBudget);
  const budgetCopyBtn = document.getElementById('budgetCopyBtn');
  if(budgetCopyBtn) budgetCopyBtn.addEventListener('click', copyPreviousBudget);
  const budgetSubmitBtn = document.getElementById('budgetSubmitBtn');
  if(budgetSubmitBtn) budgetSubmitBtn.addEventListener('click', submitBudget);
  
  const rAmount = document.getElementById('rAmount');
  if(rAmount) {
    rAmount.addEventListener('input', e => {
      const raw = e.target.value.replace(/[^0-9]/g, '');
      if (!raw) { e.target.value = ''; return; }
      e.target.value = Number(raw).toLocaleString('en-US');
    });
  }
  const prevM = document.getElementById('prevM');
  if(prevM) prevM.addEventListener('click', ()=>changeMonth(-1));
  const nextM = document.getElementById('nextM');
  if(nextM) nextM.addEventListener('click', ()=>changeMonth(1));

  const syncBtn = document.getElementById('syncBtn');
  if (syncBtn) {
    syncBtn.addEventListener('click', () => {
      syncBtn.classList.add('syncing');
      renderSyncStatus('저장대기함 및 최신 장부 동기화 중', 'syncing');
      flushPendingQueue().then(() => refreshBootData(false)).finally(() => {
        syncBtn.classList.remove('syncing');
      });
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && STATE.authToken) {
      flushPendingQueue();
      const todayYm = todayStr().slice(0,7);
      if (STATE.currentYm && STATE.currentYm !== todayYm) {
        STATE.monthMode = 'auto';
        refreshBootData(true).catch(()=>{});
      } else if (Date.now() - Number(STATE.lastSyncAt || 0) > 60000) refreshVisibleMonth(true).catch(()=>{});
    }
  });

  window.addEventListener('online', () => {
    renderSyncStatus('인터넷 연결됨 · 저장 재시도 중', 'syncing');
    flushPendingQueue();
  });
  window.addEventListener('offline', () => {
    renderSyncStatus('오프라인 · 입력은 이 기기에 안전하게 저장돼', 'pending');
  });

  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !/google(?:usercontent)?\.com$/.test(location.hostname)) {
    navigator.serviceWorker.register('/sw.js').catch(()=>{});
  }

  const addBtn = document.getElementById('addBtn');
  if(addBtn) addBtn.addEventListener('click', openQuickEntryModal);
  const deskAddBtn = document.getElementById('desktopAddBtn');
  if(deskAddBtn) deskAddBtn.addEventListener('click', openQuickEntryModal);
  const sheetX = document.getElementById('sheetX');
  if(sheetX) sheetX.addEventListener('click', closeQuickEntryModal);
  const cancelBtn = document.getElementById('cancelBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', closeQuickEntryModal);
  const overlay = document.getElementById('overlay');
  if(overlay) overlay.addEventListener('click', closeActiveSheet);

  // 저장 버튼 연결
  const submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.addEventListener('click', ()=>submitQuickTx(true));
  const continueBtn = document.getElementById('continueBtn');
  if(continueBtn) continueBtn.addEventListener('click', ()=>submitQuickTx(false));

  // 금액 입력 시 3자리 콤마(,) 실시간 자동 생성
  const fAmount = document.getElementById('fAmount');
  if(fAmount) {
    fAmount.addEventListener('input', e => {
      const raw = e.target.value.replace(/[^0-9]/g, '');
      if (!raw) {
        e.target.value = '';
        return;
      }
      const num = Number(raw);
      e.target.value = num.toLocaleString('en-US');
    });
    fAmount.addEventListener('keydown', e => {
      if(e.key === 'Enter') {
        e.preventDefault();
        const fDesc = document.getElementById('fDesc');
        if(fDesc) fDesc.focus();
      }
    });
  }
  const fDesc = document.getElementById('fDesc');
  if(fDesc) {
    fDesc.addEventListener('input', e => {
      const val = e.target.value.trim();
      const hint = document.getElementById('recommendBox');
      
      if (val && STATE.descDict && STATE.descDict[val]) {
        if (!STATE.form.catManual) {
          const dict = STATE.descDict[val];
          STATE.form.type = dict.type;
          STATE.form.cat = dict.cat;
          STATE.form.fixed = dict.fixed || '변동';
          renderFormChips();
          if (hint) hint.innerHTML = `<span style="color:var(--forest); font-size:12px; margin-top:4px; display:inline-block;">💡 <b>${val}</b> ➔ <b>${dict.cat}</b> 자동 분류</span>`;
        }
      } else {
        if (hint) hint.innerHTML = '';
        if (val && !STATE.form.catManual) {
          STATE.form.cat = '기타';
          renderFormChips();
        }
      }
    });

    fDesc.addEventListener('keydown', e => {
      if(e.key === 'Enter') {
        e.preventDefault();
        submitQuickTx(true);
      }
    });
  }
  // 다크 모드 토글 바인딩
  const themeBtn = document.getElementById('themeBtn');
  if(themeBtn) {
    themeBtn.addEventListener('click', ()=>{
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('sey_theme', isDark ? 'dark' : 'light');
      // 동적 theme-color 메타태그 변경
      const meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', isDark ? '#000000' : '#f5f5f7');
    });
    if(localStorage.getItem('sey_theme') === 'dark') {
      document.body.classList.add('dark-mode');
      themeBtn.textContent = '☀️';
      const meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content', '#000000');
    }
  }

  document.querySelectorAll('.sheet, .overlay').forEach(node => {
    const syncHidden = () => node.setAttribute('aria-hidden', node.classList.contains('on') ? 'false' : 'true');
    syncHidden();
    new MutationObserver(syncHidden).observe(node, { attributes:true, attributeFilter:['class'] });
  });

  document.addEventListener('keydown', event => {
    const active = document.querySelector('.sheet.on');
    if (!active) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      closeActiveSheet();
      return;
    }
    if (event.key !== 'Tab') return;
    const focusable = Array.from(active.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),textarea:not(:disabled),[tabindex]:not([tabindex="-1"])'))
      .filter(el => el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  bindApp();
  openGate();
});
</script>


</body>
