<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="app-version" content="2026-08-31-settlement-v5">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="지수와 하콩이의 빠르고 편한 공동 가계부">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="sey콩콩 가계부">

<title>sey콩콩 가계부</title>

<!-- 🎨 1. CSS 디자인 시스템 모듈 -->
<style>
/*  Apple Design System Tokens */
:root{
  --ink:#1d1d1f;
  --forest:#3f6b54;
  --green:#2f9e62;
  --sage:#8e8e93;
  --gold:#ff9f0a;
  --gold-soft:#fff9e6;
  --bg:#f5f5f7;
  --card:#ffffff;
  --line:#e5e5ea;
  --cat-food:#ff9a9e; --cat-food2:#fecfef;
  --cat-traffic:#a1c4fd; --cat-traffic2:#c2e9fb;
  --cat-home:#b5e8c3; --cat-home2:#d4fc79;
  --cat-shop:#f6d365; --cat-shop2:#fda085;
  --cat-event:#c3b1e1; --cat-event2:#e8d5f5;
  --cat-health:#89d4cf; --cat-health2:#c3f0ed;
  --line-soft:#f2f2f7;
  --income:#34c759;
  --expense:#ff3b30;
  --muted:#86868b;
  --shadow:0 10px 30px rgba(0,0,0,0.03);
  --r:24px; --r-sm:14px;
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI","Malgun Gothic",system-ui,sans-serif;
}
body.dark-mode{
  --ink:#f5f5f7;
  --forest:#72c594;
  --green:#65d39a;
  --sage:#98989d;
  --gold:#ffd60a;
  --gold-soft:#2c2400;
  --bg:#000000;
  --card:#1c1c1e;
  --line:#2c2c2e;
  --line-soft:#1c1c1e;
  --income:#30d158;
  --expense:#ff453a;
  --muted:#8e8e93;
  --shadow:0 10px 30px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overscroll-behavior-y:none;transition:background .25s,color .25s}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
:focus-visible{outline:3px solid color-mix(in srgb,var(--forest) 65%,#fff);outline-offset:3px}

/* =====  Apple Frosted Glass PIN Gate ===== */
#gate{position:fixed;inset:0;background:linear-gradient(180deg,#fbfbfd 0%,#f2f2f7 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:24px;text-align:center;color:var(--ink);transition:all .25s}
body.dark-mode #gate{background:linear-gradient(180deg,#1c1c1e 0%,#000000 100%)}
#gate .logo{font-size:48px;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.08))}
#gate h1{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
#gate p{color:var(--muted);font-size:14px;margin-top:6px;margin-bottom:28px}
.gate-users{display:flex;gap:8px;border:0;margin:0 0 14px;padding:0}
.gate-users input{position:absolute;opacity:0;pointer-events:none}
.gate-users span{display:flex;min-width:104px;min-height:44px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:14px;font-weight:800;color:var(--muted);transition:.15s}
.gate-users input:checked+span{background:var(--forest);border-color:var(--forest);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--forest) 28%,transparent)}
.gate-users input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--forest) 45%,#fff);outline-offset:2px}
#pin{width:220px;text-align:center;font-size:28px;letter-spacing:14px;font-weight:800;
  padding:16px 0 16px 14px;border-radius:18px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,0.05);
  font-variant-numeric:tabular-nums;transition:all .2s}
#pin:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 4px rgba(0,113,227,0.15)}
#pin.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.auto-login-wrap{margin-top:16px;display:flex;align-items:center;justify-content:center}
.auto-login-label{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 12px;border-radius:12px;background:rgba(0,0,0,0.03);transition:background .15s}
body.dark-mode .auto-login-label{background:rgba(255,255,255,0.06);color:#a1a1a6}
.auto-login-label input[type="checkbox"]{width:17px;height:17px;accent-color:var(--forest);cursor:pointer;border-radius:4px}
#gateBtn{margin-top:14px;width:220px;padding:16px;border-radius:18px;
  background:var(--forest);color:#fff;font-weight:800;font-size:16px;
  box-shadow:0 8px 20px rgba(0,113,227,0.3);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
#gateBtn:active{transform:scale(.96)}
#gateMsg{color:var(--expense);font-size:13px;height:18px;margin-top:12px;font-weight:700}

/* =====  Apple Translucent Header & Layout ===== */
#app{display:none;min-height:100%;padding-bottom:calc(var(--tabh) + var(--safe-b) + 16px)}
#app.on{display:block}

header.top{position:sticky;top:0;z-index:30;
  background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:var(--ink);border-bottom:1px solid rgba(0,0,0,0.06);
  padding:8px 14px;border-radius:0 0 18px 18px;transition:background .25s}
body.dark-mode header.top{background:rgba(28,28,30,0.85);border-bottom-color:rgba(255,255,255,0.08)}

.top-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap}
.header-left{display:none;align-items:center;gap:12px}
.header-right{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand .name{font-size:16px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:7px}
.brand .name .dot{width:8px;height:8px;border-radius:50%;background:var(--forest)}
.who{display:none;font-size:12px;color:var(--muted);font-weight:700}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav button{width:44px;height:44px;border-radius:50%;background:var(--line-soft);
  font-size:15px;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .15s}
.monthnav button:active{background:var(--line)}
.monthnav .mlabel{font-size:17px;font-weight:800;letter-spacing:-.02em;min-width:92px;text-align:center;
  font-variant-numeric:tabular-nums}
.theme-btn{min-width:44px;min-height:44px;font-size:16px;background:var(--line-soft);padding:0 10px;border-radius:12px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.desktop-nav{display:none}

main{padding:18px 16px 0}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* =====  Apple Minimal Cards ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;border:1px solid var(--line-soft)}
.sec-title{font-size:14px;font-weight:800;color:var(--muted);margin:28px 4px 14px;letter-spacing:-.01em}
.sec-title:first-child{margin-top:8px}

/*  Apple Titanium Space Gray Hero Balance Card */
.balance{background:linear-gradient(135deg,#1c1c1e 0%,#2c2c2e 100%);color:#fff;
  border-radius:26px;padding:26px;box-shadow:0 14px 40px rgba(0,0,0,0.15);position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  background:radial-gradient(circle,rgba(0,113,227,0.35),transparent 70%);border-radius:50%}
.balance .lab{font-size:13px;color:#a1a1a6;display:flex;align-items:center;gap:8px;font-weight:600}
.balance .big{font-size:42px;font-weight:900;letter-spacing:-.03em;margin-top:8px;line-height:1.05}
.balance .big.minus{color:#ff453a}
.balance .rate{display:inline-flex;align-items:center;gap:5px;margin-top:14px;background:rgba(255,255,255,0.12);
  color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px}
.daily-allowance{margin-top:14px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.1);
  font-size:13px;font-weight:700;color:#f5f5f7;display:flex;align-items:center;gap:8px}
.speed-light{margin-top:10px;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.speed-light.safe{background:rgba(52,199,89,.22);color:#34c759}
.speed-light.warning{background:rgba(255,159,10,.25);color:#ff9f0a}
.speed-light.danger{background:rgba(255,59,48,.25);color:#ff3b30}
.couple-card{margin-top:16px}
.couple-head{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:8px}
.couple-track{height:10px;background:var(--line-soft);border-radius:999px;overflow:hidden;display:flex}
.couple-fill-j{height:100%;background:var(--forest);border-radius:999px 0 0 999px}
.couple-fill-h{height:100%;background:var(--gold);border-radius:0 999px 999px 0}
.dday-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;-webkit-overflow-scrolling:touch}
.dday-strip::-webkit-scrollbar{display:none}
.dday-chip{flex:0 0 auto;padding:10px 15px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1px solid var(--line-soft);font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.dday-chip .badge{padding:3px 8px;border-radius:999px;background:var(--gold-soft);color:#705312;font-size:11px;font-weight:900}
.dday-chip.imminent .badge{background:#fbe9e6;color:var(--expense)}
.text-action{min-height:36px;padding:6px 10px;border-radius:10px;background:var(--line-soft);font-size:12px;font-weight:800;color:var(--forest)}
.del-tx-btn{min-width:36px;min-height:36px;font-size:14px;padding:6px;border-radius:10px;color:var(--muted);transition:transform .12s,background .12s;margin-left:2px;border:none;background:none;cursor:pointer}
.del-tx-btn:hover{background:#fbe9e6;color:var(--expense)}
.del-tx-btn:active{transform:scale(.88)}
.edit-tx-btn{min-width:36px;min-height:36px;font-size:14px;padding:6px;border-radius:10px;color:var(--muted);transition:transform .12s,background .12s;margin-left:0;border:none;background:none;cursor:pointer}
.edit-tx-btn:hover{background:#e8f0fe;color:var(--forest)}
.edit-tx-btn:active{transform:scale(.88)}
.cat-scroll-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.cat-scroll-bar::-webkit-scrollbar{display:none}
.cat-scroll-chip{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);transition:.15s}
.cat-scroll-chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.asset-goal-card{margin-bottom:16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:20px}
.asset-goal-head{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:800;margin-bottom:12px}
.asset-goal-head .pct{font-size:16px;font-weight:900;color:var(--forest)}
.asset-goal-track{height:12px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.asset-goal-fill{height:100%;background:linear-gradient(90deg,var(--forest),var(--green));border-radius:999px}

.user-switcher-strip{display:flex;gap:6px;background:var(--line-soft);padding:4px;border-radius:16px;margin-bottom:16px}
.user-switch-chip{flex:1;padding:9px 0;border-radius:12px;font-size:13px;font-weight:800;color:var(--muted);text-align:center;transition:.15s;border:none;background:none;cursor:pointer}
.user-switch-chip.on{background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.05)}
.filter-caption{margin:0 4px 7px;color:var(--muted);font-size:11.5px;font-weight:800}

.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.summary-grid .mini{padding:12px 6px;box-shadow:none}
.summary-grid .mini .v{font-size:clamp(12px,3.8vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}
.home-section-head .sec-title{margin:0}
.insight-panel{margin-top:16px;background:var(--card);border:1px solid var(--line-soft);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.insight-panel>summary{min-height:54px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:900;list-style:none}
.insight-panel>summary::-webkit-details-marker{display:none}
.insight-panel>summary::after{content:'+';font-size:22px;line-height:1;color:var(--muted);font-weight:500}
.insight-panel[open]>summary::after{content:'−'}
.insight-panel[open]>summary{border-bottom:1px solid var(--line-soft)}
.insight-body{padding:16px}
.insight-stack{display:flex;flex-direction:column;gap:10px}
.insight-note{padding:12px 14px;border-radius:14px;background:var(--bg);font-size:12.5px;font-weight:750;color:var(--ink)}
.insight-block{margin-top:18px}
.insight-block:first-child{margin-top:0}
.insight-title{font-size:12px;font-weight:900;color:var(--muted);margin:0 2px 9px}

.compare-badge{margin-top:12px;padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.compare-badge.safe{background:rgba(52,199,89,.2);color:#34c759}
.compare-badge.warn{background:rgba(255,159,10,.22);color:#ff9f0a}

.forecast-card{margin-top:16px;background:var(--card);border:1px solid var(--line-soft)}
.forecast-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin-bottom:8px}
.forecast-head .amt{font-size:18px;font-weight:900;color:var(--green)}
.forecast-head .amt.minus{color:var(--expense)}
.forecast-desc{font-size:12.5px;color:var(--muted);line-height:1.45}

.budget-gauge-row{margin-bottom:14px}
.budget-gauge-row:last-child{margin-bottom:0}
.budget-gauge-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:6px}
.budget-gauge-head .pct-badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:900}
.budget-gauge-head .pct-badge.safe{background:rgba(52,199,89,.15);color:var(--green)}
.budget-gauge-head .pct-badge.warn{background:rgba(255,159,10,.18);color:var(--gold)}
.budget-gauge-head .pct-badge.over{background:rgba(255,59,48,.18);color:var(--expense)}
.budget-gauge-track{height:9px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.budget-gauge-fill{height:100%;border-radius:999px}
.budget-gauge-fill.safe{background:var(--green)}
.budget-gauge-fill.warn{background:var(--gold)}
.budget-gauge-fill.over{background:var(--expense)}

/* mini 2분할 */
.mini3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.mini{background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);border:1px solid var(--line-soft);padding:14px 12px;text-align:center}
.mini .l{font-size:11.5px;color:var(--muted);font-weight:700}
.mini .v{font-size:19px;font-weight:900;margin-top:5px;letter-spacing:-.02em}
.mini .v.in{color:var(--income)} .mini .v.out{color:var(--expense)} .mini .v.sv{color:var(--gold)}

/* 분류별 바 */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .head{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .head .nm{display:flex;align-items:center;gap:8px;font-weight:700}
.bar .head .nm .e{font-size:17px}
.bar .head .amt{font-weight:800;font-variant-numeric:tabular-nums}
.bar .head .amt small{color:var(--muted);font-weight:600;margin-left:5px}
.bar .track{height:9px;background:var(--line-soft);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--forest),#58a6ff)}

/* 거래 리스트 */
.tx{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line-soft)}
.tx:last-child{border-bottom:none}
.date-group-header{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 8px;margin-top:10px;border-bottom:1.5px solid var(--line-soft)}
.date-group-header:first-child{margin-top:0}
.date-group-header .date-title{font-size:13.5px;font-weight:900;color:var(--ink)}
.date-group-header .date-total{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tx .ico{width:42px;height:42px;border-radius:14px;background:var(--line-soft);display:flex;
  align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .mid .d{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx .mid .s .tag{background:var(--line-soft);padding:2px 7px;border-radius:7px;font-weight:700}
.tx .amt{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15.5px}
.tx .amt.in{color:var(--income)} .tx .amt.out{color:var(--expense)} .tx .amt.sv{color:var(--gold)}

/* 자산 */
.total-asset{text-align:center;padding:6px 0 2px}
.total-asset .l{font-size:13px;color:var(--muted);font-weight:700}
.total-asset .v{font-size:32px;font-weight:900;color:var(--forest);letter-spacing:-.03em;margin-top:4px}

/*  Apple Wallet Card Stack */
.wallet-card-stack{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.wallet-card{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow);
  border:1px solid var(--line-soft);transition:transform .2s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;width:100%;text-align:left}
.wallet-card:active{transform:scale(.98)}
.wallet-card .wallet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wallet-card .wallet-icon{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--line-soft)}
.wallet-card .wallet-val{font-size:24px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}

/* 탭바 & 모달 */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--safe-b));
  background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,0,0,0.06);display:flex;align-items:flex-start;
  padding-bottom:var(--safe-b);z-index:40;box-shadow:0 -4px 20px rgba(0,0,0,.04);transition:background .25s}
body.dark-mode .tabbar{background:rgba(28,28,30,0.85);border-top-color:rgba(255,255,255,0.08)}
.tabbar .tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:var(--muted);gap:3px}
.tabbar .tab .ic{font-size:22px;line-height:1;opacity:.6;transition:.15s}
.tabbar .tab.active{color:var(--forest)}
.tabbar .tab.active .ic{opacity:1}
.tabbar .add{flex:0 0 auto;width:60px;height:60px;border-radius:50%;background:var(--forest);color:#fff;
  font-size:32px;font-weight:300;display:flex;align-items:center;justify-content:center;margin-top:-20px;
  box-shadow:0 8px 20px rgba(0,113,227,.35);transition:transform .15s cubic-bezier(.34,1.56,.64,1)}
.tabbar .add:active{transform:scale(.92)}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);opacity:0;visibility:hidden;

<!-- 📦 2. 데이터 상태 (Store) 모듈 -->
<script>
/* ============ 앱 글로벌 상태 (Store) ============ */
const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbwjFv7OSDc6T4vD0nUQA5E-W1QazAEU5dowQroEXard5DCMtP0FiMRlwtIjuEfDzo8phA/exec';
const APP_CACHE_VERSION = 4;
const BRIDGE_CHANNEL = 'sey-budget-bridge-v1';
const AUTH_STORAGE_KEY = 'sey_session_auth_v2';
const BOOT_CACHE_KEY = 'sey_boot_cache_v4';
const MONTH_CACHE_PREFIX = 'sey_month_cache_v4_';
const PENDING_QUEUE_KEY = 'sey_pending_tx_v2';
const SETTLEMENT_DRAFT_PREFIX = 'sey_settlement_draft_v1_';
const CACHE_MAX_AGE = 7 * 24 * 60 * 60 * 1000;

const STATE = {
  authToken: '', sessionUser: '', ym: '', currentYm: '', monthMode: 'auto', revision: 0, lastSyncAt: 0,
  config: { types: ['지출','수입','저축','대출상환'], byType: {} },
  summary: null, budget: null, recent: [], transactions: [], assets: null,
  templates: [], recurrings: [], recurringStatus: null, assetSnapshots: [], pending: [],
  aiReady: false, aiHistory: [], closeHistory: [], insight: null, descDict: {},
  editing: null, form: { type: null, cat: null, fixed: '변동', user: '', catManual: false },
  list: { mode: 'month', query: '', writer: '', type: '', category: '', rows: [], count: 0, pageSize: 40 },
  settlement: null, settlementDraft: null,
  sync: { status: 'idle', message: '', inFlight: false },
  requestSeq: 0
};

/* ============ 서버 API 통신 (GAS 직접 실행 + 제한 iframe 브리지) ============ */
const BRIDGE = { frame: null, ready: null, readyResolve: null, origin: '', calls: new Map() };

function trustedBridgeOrigin(origin){
  try {
    const host = new URL(origin).hostname;
    return origin.indexOf('https://') === 0 && (host === 'script.google.com' || host.endsWith('.googleusercontent.com'));
  } catch(e) { return false; }
}

window.addEventListener('message', event => {
  const msg = event.data || {};
  if (!trustedBridgeOrigin(event.origin) || event.source !== (BRIDGE.frame && BRIDGE.frame.contentWindow)) return;
  if (msg.channel !== BRIDGE_CHANNEL) return;
  if (msg.type === 'ready') {
    BRIDGE.origin = event.origin;
    if (BRIDGE.readyResolve) BRIDGE.readyResolve();
    return;
  }
  if (msg.type !== 'result' || !msg.id || !BRIDGE.calls.has(msg.id)) return;
  const call = BRIDGE.calls.get(msg.id);
  BRIDGE.calls.delete(msg.id);
  clearTimeout(call.timer);
  if (msg.ok) call.resolve(msg.data);
  else call.reject(new Error(msg.error || '서버 처리에 실패했어.'));
});

function ensureBridge(){
  if (BRIDGE.ready) return BRIDGE.ready;
  BRIDGE.ready = new Promise((resolve, reject) => {
    BRIDGE.readyResolve = resolve;
    const iframe = document.createElement('iframe');
    iframe.title = 'sey콩콩 데이터 연결';
    iframe.setAttribute('aria-hidden', 'true');
    iframe.tabIndex = -1;
    iframe.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px';
    iframe.src = DEFAULT_GAS_URL + '?bridge=1&v=' + APP_CACHE_VERSION;
    iframe.onerror = () => reject(new Error('구글 장부 연결을 열지 못했어.'));
    BRIDGE.frame = iframe;
    document.body.appendChild(iframe);
    setTimeout(() => {
      if (!BRIDGE.origin) reject(new Error('구글 장부 연결 시간이 초과됐어. 인터넷 연결을 확인해줘.'));
    }, 15000);
  });
  return BRIDGE.ready;
}

function resetBridge(){
  if (BRIDGE.frame && BRIDGE.frame.parentNode) BRIDGE.frame.parentNode.removeChild(BRIDGE.frame);
  BRIDGE.frame = null;
  BRIDGE.ready = null;
  BRIDGE.readyResolve = null;
  BRIDGE.origin = '';
}

function bridgeCall(fn, args, timeoutMs){
  return ensureBridge().catch(err => { resetBridge(); throw err; }).then(() => new Promise((resolve, reject) => {
    const id = 'rpc_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const timer = setTimeout(() => {
      BRIDGE.calls.delete(id);
      reject(new Error('장부 응답 시간이 초과됐어. 저장대기함에서 다시 시도할게.'));
    }, timeoutMs || 20000);
    BRIDGE.calls.set(id, { resolve, reject, timer });
    BRIDGE.frame.contentWindow.postMessage({ channel: BRIDGE_CHANNEL, type: 'request', id, fn, args }, BRIDGE.origin);
  }));
}

function srv(fn){ return function(){
  const args = Array.prototype.slice.call(arguments);
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((resolve, reject)=>{
      let settled = false;
      const timer = setTimeout(() => {
        if (!settled) { settled = true; reject(new Error('장부 응답 시간이 초과됐어.')); }
      }, 20000);
      const runner = google.script.run
        .withSuccessHandler(data => { if (!settled) { settled = true; clearTimeout(timer); resolve(data); } })
        .withFailureHandler(err => { if (!settled) { settled = true; clearTimeout(timer); reject(err instanceof Error ? err : new Error((err && err.message) || String(err))); } });
      runner[fn].apply(runner,args);
    });
  }
  return bridgeCall(fn, args, 20000);
}; }

function api(fn){
  const args = Array.prototype.slice.call(arguments,1);
  if (!STATE.authToken) return Promise.reject(new Error('로그인이 필요해.'));
  args.unshift(STATE.authToken);
  return srv(fn).apply(null,args).catch(err => {
    const text = (err && err.message) || '';
    if (/세션|로그인이 필요/.test(text) && typeof showLoginGate === 'function') showLoginGate(text);
    throw err;
  });
}

function saveSession(session, remember){
  const target = remember === false ? sessionStorage : localStorage;
  const other = remember === false ? localStorage : sessionStorage;
  target.setItem(AUTH_STORAGE_KEY, JSON.stringify(session));
  other.removeItem(AUTH_STORAGE_KEY);
}

function loadSession(){
  const raw = localStorage.getItem(AUTH_STORAGE_KEY) || sessionStorage.getItem(AUTH_STORAGE_KEY);
  if (!raw) return null;
  try {
    const session = JSON.parse(raw);
    if (!session.token || Number(session.expiresAt || 0) <= Date.now()) throw new Error('expired');
    return session;
  } catch(e) {
    localStorage.removeItem(AUTH_STORAGE_KEY);
    sessionStorage.removeItem(AUTH_STORAGE_KEY);
    return null;
  }
}

function clearSession(){
  localStorage.removeItem(AUTH_STORAGE_KEY);
  sessionStorage.removeItem(AUTH_STORAGE_KEY);
  STATE.authToken = '';
}

function cacheEnvelope(data){
  return { version: APP_CACHE_VERSION, savedAt: Date.now(), revision: Number(data.revision || 0), data: data };
}

function readCache(key){
  try {
    const item = JSON.parse(localStorage.getItem(key) || 'null');
    if (!item || item.version !== APP_CACHE_VERSION || !item.data || Date.now() - item.savedAt > CACHE_MAX_AGE) return null;
    return item.data;
  } catch(e) { return null; }
}

function saveBootCache(data){
  if (!data) return;
  localStorage.setItem(BOOT_CACHE_KEY, JSON.stringify(cacheEnvelope(data)));
  if (data.ym) saveMonthCache(data.ym, data);
}

function loadBootCache(){ return readCache(BOOT_CACHE_KEY); }
function saveMonthCache(ym, data){ localStorage.setItem(MONTH_CACHE_PREFIX + ym, JSON.stringify(cacheEnvelope(data))); }
function loadMonthCache(ym){ return readCache(MONTH_CACHE_PREFIX + ym); }
function clearCachedViews(){
  localStorage.removeItem(BOOT_CACHE_KEY);
  Object.keys(localStorage).filter(key => key.indexOf(MONTH_CACHE_PREFIX) === 0).forEach(key => localStorage.removeItem(key));
}

function loadPendingQueue(){
  try {
    const rows = JSON.parse(localStorage.getItem(PENDING_QUEUE_KEY) || '[]');
    return Array.isArray(rows) ? rows : [];
  } catch(e) { return []; }
}

function persistPendingQueue(){
  localStorage.setItem(PENDING_QUEUE_KEY, JSON.stringify(STATE.pending || []));
  renderSyncStatus();
}

function createClientId(){
  if (window.crypto && crypto.randomUUID) return 'web_' + crypto.randomUUID();
  return 'web_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}

function renderSyncStatus(message, kind){
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const count = (STATE.pending || []).length;
  const text = message || (count ? count + '건 저장 대기 중' : '모든 변경 저장됨');
  el.textContent = text;
  el.className = 'on ' + (kind || (count ? 'pending' : 'saved'));
  el.setAttribute('role', 'status');
  el.setAttribute('aria-live', 'polite');
  if (!count && !message) setTimeout(() => { if (el.textContent === text) el.className = ''; }, 1600);
}

/* ============ 유틸리티 함수 ============ */
function fmt(n){ n=Math.round(n||0); const neg=n<0; return (neg?'-':'')+'₩'+Math.abs(n).toLocaleString('en-US'); }
function comma(n){ return Math.round(Math.abs(n||0)).toLocaleString('en-US'); }
function pad(x){ return String(x).padStart(2,'0'); }
function todayStr(){
  try {
    const parts = new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date());
    const map = {}; parts.forEach(p => { map[p.type] = p.value; });
    return map.year+'-'+map.month+'-'+map.day;
  } catch(e) {
    const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
}
function lastDateOfYm(ym){
  const parts = String(ym || todayStr().slice(0,7)).split('-');
  const d = new Date(Number(parts[0]), Number(parts[1]), 0);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function settlementDraftKey(ym){ return SETTLEMENT_DRAFT_PREFIX + String(ym || ''); }
function loadSettlementDraft(ym){
  try {
    const data = JSON.parse(localStorage.getItem(settlementDraftKey(ym)) || 'null');
    return data && data.ym === ym && Array.isArray(data.rows) ? data : { ym:ym, rows:[], pasteText:'', updatedAt:0 };
  } catch(e) { return { ym:ym, rows:[], pasteText:'', updatedAt:0 }; }
}
function saveSettlementDraft(draft){
  if (!draft || !draft.ym) return;
  draft.updatedAt = Date.now();
  STATE.settlementDraft = draft;
  localStorage.setItem(settlementDraftKey(draft.ym), JSON.stringify(draft));
}
function clearSettlementDraft(ym){
  localStorage.removeItem(settlementDraftKey(ym));
  if (STATE.settlementDraft && STATE.settlementDraft.ym === ym) STATE.settlementDraft = { ym:ym, rows:[], pasteText:'', updatedAt:Date.now() };
}
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function emo(cat){
  const m={'식비':'🍔','교통/차량':'🚗','주거/통신':'🏠','쇼핑/문화':'🛍️','경조/이벤트':'🎉','건강/의료':'💊','용돈':'🪙','월급':'💰','상여':'💎','금융수입':'📈','기타수입':'💳'};
  return m[cat]||'🏷️';
}

let toastT;
function toast(msg, err){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg; t.className='on'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className=t.className.replace('on',''), err?2800:1800);
}
</script>


<!-- 🧩 3. UI 컴포넌트 (Components) 모듈 -->
<script>
/* ============ UI 컴포넌트 렌더러 (Components) ============ */

function settlementDraftForCurrent(){
  const ym = STATE.ym || todayStr().slice(0,7);
  if (!STATE.settlementDraft || STATE.settlementDraft.ym !== ym) STATE.settlementDraft = loadSettlementDraft(ym);
  const draft = STATE.settlementDraft;
  if (!Array.isArray(draft.rows)) draft.rows = [];
  if (!Array.isArray(draft.reconciliations)) draft.reconciliations = [];
  if (!Array.isArray(draft.investments)) draft.investments = [];
  return draft;
}

function settlementCategories(type, selected){
  const cfg = (STATE.config && STATE.config.byType) || {};
  const base = cfg[type] || (type === '수입' ? ['월급','상여','금융수입','기타수입'] : type === '저축' ? ['주식/투자','저축'] : ['식비','교통/차량','주거/통신','쇼핑/문화','경조/이벤트','건강/의료','용돈','기타']);
  const cats = base.slice();
  if (selected && cats.indexOf(selected) < 0) cats.push(selected);
  return cats;
}

function settlementSourceTotals(settlement, draft){
  const map = {};
  (settlement.sourceTotals || []).forEach(item => {
    map[item.source] = { source:item.source, total:Number(item.total || 0), count:Number(item.count || 0) };
  });
  (draft.rows || []).forEach(row => {
    const source = String(row.source || '').trim();
    if (!source) return;
    if (!map[source]) map[source] = { source:source, total:0, count:0 };
    map[source].total += Number(String(row.amount || '').replace(/[^0-9.-]/g,'')) || 0;
    map[source].count++;
  });
  return Object.keys(map).sort().map(key => map[key]);
}

function mergedReconciliations(settlement, draft){
  const map = {};
  (settlement.reconciliations || []).forEach(row => { map[row.source] = Object.assign({}, row); });
  (draft.reconciliations || []).forEach(row => {
    if (!row || !row.source) return;
    map[row.source] = Object.assign({}, map[row.source] || {}, row);
  });
  const sourceTotals = settlementSourceTotals(settlement, draft);
  sourceTotals.forEach(item => {
    if (!map[item.source]) map[item.source] = { source:item.source, statementTotal:0 };
    map[item.source].enteredTotal = item.total;
    const hasStatement = map[item.source].statementTotal !== '' && map[item.source].statementTotal != null && Number(map[item.source].statementTotal) > 0;
    map[item.source].difference = hasStatement ? Number(map[item.source].statementTotal) - item.total : null;
    map[item.source].status = !hasStatement ? '명세서 입력 필요' : Math.abs(map[item.source].difference) < 1 ? '일치' : '차이';
  });
  return Object.keys(map).sort().map(key => map[key]);
}

function mergedInvestments(settlement, draft){
  const map = {};
  (settlement.investments || []).forEach(row => { map[row.account] = Object.assign({}, row); });
  (draft.investments || []).forEach(row => {
    if (!row || !row.account) return;
    map[row.account] = Object.assign({}, map[row.account] || {}, row);
  });
  return Object.keys(map).sort().map(key => {
    const row = map[key];
    const previousValue = Number(row.previousValue || 0);
    const netContribution = Number(row.netContribution || 0);
    const endValue = Number(row.endValue || 0);
    return Object.assign({}, row, { previousValue, netContribution, endValue, valuationChange:endValue - previousValue - netContribution });
  });
}

function settlementTxRow(row, index){
  const type = row.type || '지출';
  const cats = settlementCategories(type, row.cat || '');
  const types = ((STATE.config && STATE.config.types) || ['지출','수입','저축','대출상환']);
  const users = ['하콩','지수'];
  return `<div class="settlement-tx-row" data-draft-index="${index}">
    <div class="settlement-row-top"><strong>${index + 1}</strong><button type="button" class="settlement-remove" onclick="removeSettlementDraftRow(${index})" aria-label="${index + 1}번 초안 행 삭제">삭제</button></div>
    <div class="settlement-grid settlement-grid-main">
      <label>날짜<input type="date" value="${esc(row.date || lastDateOfYm(STATE.ym))}" onchange="updateSettlementDraftRow(${index},'date',this.value)"></label>
      <label>출처/계좌<input type="text" value="${esc(row.source || '')}" placeholder="예: 신한카드" oninput="updateSettlementDraftRow(${index},'source',this.value)"></label>
      <label>구분<select onchange="changeSettlementDraftType(${index},this.value)">${types.map(t=>`<option value="${esc(t)}" ${t===type?'selected':''}>${esc(t)}</option>`).join('')}</select></label>
      <label>분류<select onchange="updateSettlementDraftRow(${index},'cat',this.value)">${cats.map(c=>`<option value="${esc(c)}" ${c===(row.cat || cats[0])?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="settlement-desc">내역<input type="text" value="${esc(row.desc || '')}" placeholder="예: 마트, 카드 결제" oninput="updateSettlementDraftRow(${index},'desc',this.value)"></label>
      <label>금액<input inputmode="numeric" value="${row.amount ? comma(row.amount) : ''}" placeholder="0" oninput="updateSettlementAmount(${index},this)"></label>
      <label>입력자<select onchange="updateSettlementDraftRow(${index},'user',this.value)">${users.map(u=>`<option value="${u}" ${u===(row.user || STATE.sessionUser || '하콩')?'selected':''}>${u}</option>`).join('')}</select></label>
    </div>
  </div>`;
}

function renderSettlementHome(el){
  const settlement = STATE.settlement || {};
  const draft = settlementDraftForCurrent();
  const reconRows = mergedReconciliations(settlement, draft);
  const investmentRows = mergedInvestments(settlement, draft);
  const sourceTotals = settlementSourceTotals(settlement, draft);
  const matchingRecon = reconRows.filter(row => row.status === '일치').length;
  const investmentTotal = investmentRows.reduce((sum,row)=>sum + Number(row.endValue || 0),0);
  const valuationChange = investmentRows.reduce((sum,row)=>sum + Number(row.valuationChange || 0),0);
  const recurringCount = (settlement.recurringCandidates || []).length;
  const statusLabel = settlement.isClosed ? '마감 완료' : '정산 중';
  const sourceHtml = sourceTotals.length ? sourceTotals.map(item => `<div class="settlement-source"><span>${esc(item.source)}</span><strong>${fmt(item.total)}</strong><small>${item.count}건</small></div>`).join('') : '<div class="settlement-empty-inline">출처를 적으면 카드·계좌별 합계를 바로 대사할 수 있어요.</div>';
  const draftHtml = draft.rows.length ? draft.rows.map(settlementTxRow).join('') : `<div class="settlement-empty"><strong>아직 작성한 거래가 없어요.</strong><span>행을 추가하거나 카드·계좌 내역을 붙여넣어 시작해줘.</span></div>`;
  const reconHtml = reconRows.length ? reconRows.map((row,index) => `<div class="recon-row">
    <div><strong>${esc(row.source)}</strong><small>입력 ${fmt(row.enteredTotal || 0)}</small></div>
    <label>명세서 합계<input inputmode="numeric" value="${row.statementTotal ? comma(row.statementTotal) : ''}" placeholder="0" oninput="updateSettlementRecon(${index},'statementTotal',this.value)"></label>
    <div class="recon-diff ${row.status==='일치'?'ok':row.status==='차이'?'warn':''}">${row.status==='일치'?'일치':row.difference==null?'입력 필요':'차이 '+fmt(row.difference)}</div>
  </div>`).join('') : '<div class="settlement-empty-inline">먼저 거래 행에 출처/계좌를 적어줘.</div>';
  const investmentHtml = investmentRows.length ? investmentRows.map((row,index) => `<div class="investment-row">
    <input aria-label="투자계좌" value="${esc(row.account || '')}" placeholder="예: 해외주식" oninput="updateSettlementInvestment(${index},'account',this.value)">
    <label>전월말<input inputmode="numeric" value="${row.previousValue ? comma(row.previousValue) : ''}" placeholder="0" oninput="updateSettlementInvestmentAmount(${index},'previousValue',this)"></label>
    <label>순입금<input inputmode="numeric" value="${row.netContribution ? comma(row.netContribution) : ''}" placeholder="0" oninput="updateSettlementInvestmentAmount(${index},'netContribution',this)"></label>
    <label>월말값<input inputmode="numeric" value="${row.endValue ? comma(row.endValue) : ''}" placeholder="0" oninput="updateSettlementInvestmentAmount(${index},'endValue',this)"></label>
    <strong class="valuation ${row.valuationChange<0?'minus':''}">${row.valuationChange>=0?'+':''}${fmt(row.valuationChange)}</strong>
    <button type="button" class="settlement-remove" onclick="removeSettlementInvestment(${index})" aria-label="투자 계좌 삭제">삭제</button>
  </div>`).join('') : '<div class="settlement-empty-inline">증권계좌별 월말 평가액을 입력하면 투자금과 수익 변동을 분리해줘요.</div>';
  el.innerHTML = `
    <section class="settlement-hero">
      <div class="settlement-eyebrow">${settlement.currentYm || STATE.currentYm || todayStr().slice(0,7)} 기준 · 지난달 정산</div>
      <div class="settlement-title-line"><h1>${STATE.ym} 정산</h1><span class="settlement-status ${settlement.isClosed?'closed':''}">${statusLabel}</span></div>
      <p>거래를 모아 입력하고, 카드·계좌와 투자 월말값까지 맞춘 뒤 한 번에 마감해요.</p>
      <div class="settlement-metrics"><div><span>확정 거래</span><strong>${settlement.transactionCount || 0}건</strong></div><div><span>작성 초안</span><strong>${draft.rows.length}건</strong></div><div><span>대사 일치</span><strong>${matchingRecon}/${reconRows.length}</strong></div></div>
    </section>

    <section class="settlement-card">
      <div class="settlement-section-head"><div><span class="settlement-step">1</span><h2>거래 한꺼번에 입력</h2></div><div class="settlement-actions"><button type="button" onclick="addSettlementDraftRow()">행 추가</button><button type="button" onclick="loadRecurringSettlementDrafts()" ${recurringCount?'':'disabled'}>정기거래 ${recurringCount ? recurringCount+'건' : '없음'}</button></div></div>
      <details class="settlement-paste"><summary>카드·계좌 내역 붙여넣기</summary><p>날짜 · 출처 · 내역 · 금액 순서로 탭으로 구분해 붙여넣으면 돼요.</p><textarea id="settlementPaste" placeholder="2026-08-02&#9;신한카드&#9;마트&#9;52,300"></textarea><button type="button" onclick="importSettlementPaste()">초안에 추가</button></details>
      <div class="settlement-draft-list">${draftHtml}</div>
      <div class="settlement-savebar"><div>초안 ${draft.rows.length}건 · 이 화면을 닫아도 기기에 남아요</div><button type="button" class="primary" onclick="submitSettlementDraft()" ${draft.rows.length?'':'disabled'}>거래 ${draft.rows.length}건 확정 저장</button></div>
    </section>

      <div class="settlement-section-head"><div><span class="settlement-step">2</span><h2>카드·계좌 대사</h2></div><button type="button" onclick="saveSettlementReconciliations()">대사 저장</button></div>
      <div class="settlement-source-list">${sourceHtml}</div>
      <div class="recon-list">${reconHtml}</div>
    </section>

    <section class="settlement-card">
      <div class="settlement-section-head"><div><span class="settlement-step">3</span><h2>투자·자산 월말값</h2></div><button type="button" onclick="addSettlementInvestment()">계좌 추가</button></div>
      <p class="settlement-help">순입금과 월말 평가액을 분리해 생활비와 투자 수익을 섞지 않아요.</p>
      <div class="investment-list">${investmentHtml}</div>
      <div class="investment-total"><span>투자 월말 합계 ${fmt(investmentTotal)}</span><strong class="${valuationChange<0?'minus':''}">평가증감 ${valuationChange>=0?'+':''}${fmt(valuationChange)}</strong></div>
      <div class="settlement-actions bottom"><button type="button" onclick="saveSettlementInvestments()">투자 월말값 저장</button><button type="button" onclick="syncSettlementInvestmentsToAssets()">자산현황에 반영</button></div>
    </section>

    <section class="settlement-card settlement-close-card">
      <div class="settlement-section-head"><div><span class="settlement-step">4</span><h2>${STATE.ym} 마감</h2></div></div>
      <p>초안 거래를 모두 확정하고 대사·투자 입력을 확인한 뒤 마감해요. 마감 후 수정은 다시 열기 기록으로 남아요.</p>
      <button type="button" class="primary close" onclick="finalizeSettlement()">${STATE.ym} 정산 마감</button>
    </section>
  `;
}

function renderHome(){
  const el=document.getElementById('v-home');
  if(!el) return;
  if (STATE.settlement && STATE.settlement.showWorkspace && !STATE.settlement.isClosed) {
    renderSettlementHome(el);
    return;
  }
  const keepInsightsOpen = !!(el.querySelector('#homeInsights') && el.querySelector('#homeInsights').open);
  if(!STATE.summary) {
    el.innerHTML = `
      <div class="skeleton skeleton-balance"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="skeleton skeleton-mini"></div>
        <div class="skeleton skeleton-mini"></div>
      </div>
      <div class="skeleton skeleton-card" style="margin-top:16px"></div>
      <div class="skeleton skeleton-card"></div>
    `;
    return;
  }
  const s=STATE.summary;
  const minus = s.left<0;
  const selectedYm = STATE.ym || todayStr().slice(0,7);
  const todayYm = todayStr().slice(0,7);
  const isCurrentMonth = selectedYm === todayYm;
  const isPastMonth = selectedYm < todayYm;
  const ymParts = selectedYm.split('-');
  const monthLabel = `${Number(ymParts[0])}년 ${Number(ymParts[1])}월`;
  const closedMonthHtml = (STATE.settlement && STATE.settlement.isClosed && isPastMonth) ? `
    <div class="settlement-closed-note"><div><strong>${STATE.ym} 정산을 마감했어요.</strong><span>수정이 필요하면 정산을 다시 열 수 있어요. 변경 기록은 남습니다.</span></div><button type="button" onclick="reopenSettlement()">정산 다시 열기</button></div>
  ` : '';
  const cats = s.cats || [];
  const maxCat = cats.length? cats[0].amt : 1;
  const topCats = cats.slice(0,3);

  let bars = topCats.length ? topCats.map(c=>{
    const pct = Math.max(4, Math.round(c.amt/maxCat*100));
    const sharePct = s.expense>0? Math.round(c.amt/s.expense*100):0;
    return `<div class="bar">
      <div class="head"><div class="nm"><span class="e">${emo(c.cat)}</span>${esc(c.cat)}</div>
      <div class="amt">${fmt(c.amt)}<small>${sharePct}%</small></div></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  }).join('') : `<div class="empty"><span class="e">🍃</span>이번 달 지출이 아직 없어</div>`;

  const monthRows = STATE.transactions || [];
  let recent5Src = monthRows.slice(0,5);
  // 입력자 필터는 거래 목록에만 적용하고 공동 잔액은 항상 전체 합계를 유지한다.
  if (STATE.userFilter) {
    recent5Src = monthRows.filter(t => t.user === STATE.userFilter).slice(0,5);
  }
  let recent5 = recent5Src.map(txRow).join('') ||
    `<div class="empty"><span class="e">📭</span>아직 입력된 거래가 없어</div>`;

  // 예측값은 오늘이 포함된 현재 월에서만 계산한다.
  const now = new Date();
  const currentDay = now.getDate();
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysLeft = Math.max(1, lastDay - currentDay + 1);
  const dailyAllowance = Math.max(0, Math.round((s.left || 0) / daysLeft));

  const elapsedRatio = currentDay / lastDay;
  const totalBudgetOrIncome = Math.max(1, (s.income || (s.expense + Math.max(0, s.left))));
  const spentRatio = s.expense / totalBudgetOrIncome;
  let speedColor = '🟢', speedText = '권장 페이스대로 여유 있게 관리 중이에요', speedClass = 'safe';
  if (spentRatio > elapsedRatio * 1.2) {
    speedColor = '🔴'; speedText = '지출 속도가 빨라요! 예산 조율이 필요해요'; speedClass = 'danger';
  } else if (spentRatio > elapsedRatio * 1.05) {
    speedColor = '🟡'; speedText = '지출 페이스가 약간 가속되고 있어요'; speedClass = 'warning';
  }

  // 고정비 D-Day는 현재 월에만 의미가 있다.
  const recurrings = STATE.recurrings || [];
  const upcomingRec = recurrings.filter(r => r.enabled !== false && Number(r.day || 0) >= currentDay)
    .sort((a,b) => Number(a.day) - Number(b.day));
  const ddayChipsHtml = upcomingRec.length ? upcomingRec.slice(0,4).map(r => {
    const dday = Number(r.day) - currentDay;
    const badgeText = dday === 0 ? '오늘' : `D-${dday}`;
    const imminent = dday <= 3;
    return `<div class="dday-chip ${imminent?'imminent':''}">
      <span class="badge">${badgeText}</span>
      <span>${esc(r.name || r.cat)}</span>
      <span style="color:var(--muted);font-size:11.5px">${fmt(r.amount || 0)}</span>
    </div>`;
  }).join('') : `<div class="dday-chip"><span>남은 고정비가 없어요 🍃</span></div>`;

  // 지수 vs 하콩 부부 분담 계산
  let jisooSpent = 0, hayoungSpent = 0;
  (monthRows || []).forEach(t => {
    if (t.type === '지출') {
      if (t.user === '지수') jisooSpent += Number(t.amount || 0);
      else if (t.user === '하콩') hayoungSpent += Number(t.amount || 0);
    }
  });
  const totalCoupleSpent = jisooSpent + hayoungSpent;
  const jisooPct = totalCoupleSpent ? Math.round((jisooSpent / totalCoupleSpent) * 100) : 0;
  const hayoungPct = totalCoupleSpent ? 100 - jisooPct : 0;

  // 현재까지의 금액을 지난달 전체와 비교한다는 점을 문구에 정확히 표시한다.
  let compareBadgeHtml = '';
  const lastClose = (STATE.closeHistory && STATE.closeHistory.length) ? STATE.closeHistory[0] : null;
  if (isCurrentMonth && lastClose && lastClose.expense > 0) {
    const diff = s.expense - lastClose.expense;
    if (diff < 0) {
      compareBadgeHtml = `<div class="compare-badge safe">지난달 총지출까지 <strong>${fmt(Math.abs(diff))}</strong> 남았어요</div>`;
    } else if (diff > 0) {
      compareBadgeHtml = `<div class="compare-badge warn">지난달 총지출보다 <strong>${fmt(diff)}</strong> 많아요</div>`;
    }
  }

  const currentFilter = STATE.userFilter || '';
  const switcherHtml = `

function formatDateTitle(dateStr){
  if(!dateStr) return '날짜 미지정';
  const today = todayStr();
  if(dateStr === today) return '오늘';
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if(dateStr === yesterday.toISOString().slice(0,10)) return '어제';
  const d = new Date(dateStr);
  const days = ['일','월','화','수','목','금','토'];
  const dayName = isNaN(d.getDay()) ? '' : ' ' + days[d.getDay()] + '요일';
  const parts = dateStr.split('-');
  if(parts.length===3) return `${Number(parts[1])}월 ${Number(parts[2])}일${dayName}`;
  return dateStr;
}

function catColorClass(cat){
  if(!cat) return 'ico-default';
  if(cat.indexOf('식비')>-1) return 'ico-food';
  if(cat.indexOf('교통')>-1 || cat.indexOf('차량')>-1) return 'ico-traffic';
  if(cat.indexOf('주거')>-1 || cat.indexOf('통신')>-1) return 'ico-home';
  if(cat.indexOf('쇼핑')>-1 || cat.indexOf('문화')>-1) return 'ico-shop';
  if(cat.indexOf('경조')>-1 || cat.indexOf('이벤트')>-1) return 'ico-event';
  if(cat.indexOf('건강')>-1 || cat.indexOf('의료')>-1) return 'ico-health';
  if(cat.indexOf('월급')>-1 || cat.indexOf('수입')>-1 || cat.indexOf('상여')>-1 || cat.indexOf('금융')>-1) return 'ico-income';
  return 'ico-default';
}

function txRow(t){
  const sign = t.type==='수입' ? '+' : '-';
  const cls = t.type==='수입' ? 'in' : 'out';
  const icoColor = catColorClass(t.cat);
  const safeDesc = esc(t.desc||t.cat||'거래').replace(/'/g, "\\'");
  const safeRow = String(t.row || '').replace(/['\\]/g, '');
  const txRef = String(t.txId || safeRow).replace(/['\\]/g, '');
  const isTemp = t.syncState === 'pending' || t.syncState === 'error' || String(t.row).startsWith('temp_');
  const editBtn = isTemp ? '' : `<button type="button" class="edit-tx-btn" title="수정" onclick="event.stopPropagation(); editTx('${t.row}')">✏️</button>`;
  const delBtn  = `<button type="button" class="del-tx-btn" title="${isTemp?'저장 대기 취소':'삭제'}" aria-label="${isTemp?'저장 대기 취소':'거래 삭제'}" onclick="event.stopPropagation(); deleteTxPrompt('${safeRow}', '${safeDesc}', ${Number(t.amount || 0)}, '${esc(t.type)}')">${isTemp?'✕':'🗑️'}</button>`;
  const pendingBadge = isTemp ? `<span class="sync-badge ${t.syncState==='error'?'error':''}">${t.syncState==='error'?'재시도 대기':'저장 중'}</span>` : '';
  let actionHtml = '';
  if (STATE.bulkMode) {
    if (isTemp) actionHtml = pendingBadge;
    else {
      const isChecked = STATE.bulkSelection && STATE.bulkSelection.has(txRef);
      actionHtml = `<div style="padding:10px 10px 10px 0; display:flex; align-items:center;">
        <input type="checkbox" data-row="${txRef}" ${isChecked?'checked':''} style="width:20px;height:20px;accent-color:var(--forest);" onclick="event.stopPropagation(); toggleBulkSelect('${txRef}', this.checked)">
      </div>`;
    }
  } else {
    actionHtml = `${pendingBadge}
    <div class="amt ${cls}">${sign}${comma(t.amount)}</div>
    ${editBtn}${delBtn}`;
  }

  return `<div class="tx" data-row="${safeRow}" ${STATE.bulkMode && !isTemp ? `onclick="const cb=this.querySelector('input[type=checkbox]'); if(cb) { cb.checked=!cb.checked; toggleBulkSelect('${txRef}', cb.checked); }"` : ''}>
    ${STATE.bulkMode ? actionHtml : ''}
    <div class="ico ${icoColor}">${emo(t.cat)}</div>
    <div class="mid"><div class="d">${esc(t.desc||t.cat||'(내역없음)')}</div>
      <div class="s">
        <span class="tag">${esc(t.cat)}</span>${t.source ? `<span class="tag source-tag">${esc(t.source)}</span>` : ''}
      </div>
    </div>
    ${STATE.bulkMode ? '' : actionHtml}
  </div>`;
}

function txGroupedRows(list){
  if(!list || !list.length) return '';
  const groups = {};
  const dates = [];
  list.forEach(t=>{
    const d = t.date || '기타';
    if(!groups[d]){ groups[d] = { rows:[], daySpent:0 }; dates.push(d); }
    groups[d].rows.push(t);
    if(t.type === '지출') groups[d].daySpent += Number(t.amount||0);
  });
  return dates.map(d=>{
    const g = groups[d];
    const header = `<div class="date-group-header">
      <span class="date-title">${formatDateTitle(d)}</span>
      <span class="date-total">${g.daySpent > 0 ? '지출 ' + comma(g.daySpent) + '원' : ''}</span>
    </div>`;
    const rowsHtml = g.rows.map(txRow).join('');
    return header + rowsHtml;
  }).join('');
}

<!-- ⚡ 4. 바인딩 & 앱 제어 (App) 모듈 -->
<script>
/* ============ 비즈니스 로직 & 이벤트 바인딩 (App) ============ */

let LAST_DIALOG_TRIGGER = null;
function rememberDialogTrigger(){
  if (document.activeElement && document.activeElement !== document.body) LAST_DIALOG_TRIGGER = document.activeElement;
}
function restoreDialogTrigger(){
  const target = LAST_DIALOG_TRIGGER;
  LAST_DIALOG_TRIGGER = null;
  if (target && document.contains(target) && typeof target.focus === 'function') setTimeout(() => target.focus(), 0);
}

function openGate(){
  // v1에서 평문 PIN과 전체 상태를 저장하던 키는 첫 실행 즉시 폐기한다.
  localStorage.removeItem('sey_pin_auth');
  localStorage.removeItem('sey_boot_cache');
  const btn = document.getElementById('gateBtn');
  const pinEl = document.getElementById('pin');
  const msg = document.getElementById('gateMsg');
  const gate = document.getElementById('gate');
  const autoLoginChk = document.getElementById('autoLogin');
  if(!btn || !pinEl) return;
  STATE.pending = loadPendingQueue();

  const cachedData = loadBootCache();
  const savedSession = loadSession();
  if (savedSession) {
    STATE.authToken = savedSession.token;
    STATE.sessionUser = savedSession.user || '하콩';
    STATE.form.user = STATE.sessionUser;
    if (cachedData) {
      applyBootData(cachedData);
      mergePendingTransactions();
      showMainApp();
      renderAll();
      renderSyncStatus('저장된 화면 표시 · 최신 데이터 확인 중', 'syncing');
      refreshBootData(true);
    } else {
      btn.disabled = true;
      btn.textContent = '장부 여는 중…';
      api('getBoot').then(data => {
        applyBootData(data);
        saveBootCache(data);
        showMainApp();
        mergePendingTransactions();
        renderAll();
        flushPendingQueue();
      }).catch(err => handleSessionError(err, msg, btn));
    }
    return;
  }

  function tryOpen(){
    const val = pinEl.value.trim();
    if(!val){ msg.textContent='PIN을 입력해줘'; return; }

    btn.disabled=true; btn.textContent='확인 중…'; msg.textContent='';
    const userEl = document.querySelector('input[name="gateUser"]:checked');
    const user = userEl ? userEl.value : '하콩';
    const remember = autoLoginChk ? autoLoginChk.checked : true;
    srv('createSessionAndGetBoot')(val, user, remember).then(result => {
      const session = result.session;
      STATE.authToken = session.token;
      STATE.sessionUser = session.user || user;
      STATE.form.user = STATE.sessionUser;
      saveSession(session, remember);
      return result.boot;
    }).then(data => {
      applyBootData(data);
      saveBootCache(data);
      showMainApp();
      mergePendingTransactions();
      renderAll();
      flushPendingQueue();
      toast(remember ? '✅ 이 기기에서 안전하게 로그인 유지' : '✅ 이번 접속만 로그인');
    }).catch(e=>{
      clearSession();
      btn.disabled=false; btn.textContent='열기';
      msg.textContent = (e&&e.message) ? e.message : '연결 오류, 다시 시도해줘';
      pinEl.value=''; pinEl.classList.add('shake'); setTimeout(()=>pinEl.classList.remove('shake'),400);
    });
  }
  btn.addEventListener('click', tryOpen);
  pinEl.addEventListener('keydown', e=>{ if(e.key==='Enter') tryOpen(); });
  pinEl.focus();
}

function showMainApp(){
  const gate = document.getElementById('gate');
  if (gate) gate.style.display = 'none';
  const app = document.getElementById('app');
  if (app) app.classList.add('on');
}

function showLoginGate(message){
  clearSession();
  const app = document.getElementById('app');
  const gate = document.getElementById('gate');
  const btn = document.getElementById('gateBtn');
  const pin = document.getElementById('pin');
  const msg = document.getElementById('gateMsg');
  if (app) app.classList.remove('on');
  if (gate) gate.style.display = 'flex';
  if (btn) { btn.disabled = false; btn.textContent = '열기'; }
  if (pin) { pin.value = ''; setTimeout(() => pin.focus(), 0); }
  if (msg) msg.textContent = message || '로그인이 만료됐어. PIN을 다시 입력해줘.';
}

function handleSessionError(err, msgEl, btn){
  const text = (err && err.message) || '연결 오류가 발생했어.';
  if (/세션|로그인이 필요/.test(text)) {
    showLoginGate(text);
    return;
  }
  if (msgEl) msgEl.textContent = text;
  if (btn) { btn.disabled = false; btn.textContent = '열기'; }
  if (!loadBootCache()) toast(text, true);
}

function logout(){
  if ((STATE.pending || []).length) {
    toast('저장 대기 중인 입력을 먼저 동기화해줘.', true);
    flushPendingQueue();
    return;
  }
  if(!confirm('로그아웃하고 자동 로그인을 해제할까요?')) return;
  clearSession();
  clearCachedViews();
  toast('👋 로그아웃되었습니다.');
  setTimeout(() => location.reload(), 500);
}

function applyBootData(data){
  if (!data) return;
  const shouldAdoptWorkMonth = STATE.monthMode !== 'manual' || !STATE.ym;
  if (shouldAdoptWorkMonth) STATE.ym = data.workYm || data.ym || STATE.ym;
  STATE.currentYm = data.currentYm || STATE.currentYm || todayStr().slice(0,7);
  STATE.revision = Number(data.revision || STATE.revision || 0);
  STATE.lastSyncAt = Number(data.serverTime || Date.now());
  STATE.sessionUser = data.sessionUser || STATE.sessionUser;
  STATE.form.user = STATE.form.user || STATE.sessionUser || '하콩';
  STATE.config = data.config || STATE.config;
  STATE.summary = data.summary || STATE.summary;
  STATE.budget = data.budget || STATE.budget;
  STATE.recent = data.recent || STATE.recent || [];
  STATE.transactions = data.transactions || STATE.transactions || [];
  STATE.settlement = data.settlement || STATE.settlement;
  if (STATE.settlement && STATE.settlement.ym === STATE.ym) STATE.settlementDraft = loadSettlementDraft(STATE.ym);
  applyGlobalData(data);
}

function applyGlobalData(data){
  if (!data) return;
  STATE.revision = Number(data.revision || STATE.revision || 0);
  STATE.lastSyncAt = Number(data.serverTime || Date.now());
  STATE.sessionUser = data.sessionUser || STATE.sessionUser;
  STATE.form.user = STATE.form.user || STATE.sessionUser || '하콩';
  STATE.config = data.config || STATE.config;
  STATE.assets = data.assets || STATE.assets;
  STATE.templates = data.templates || STATE.templates || [];
  STATE.recurrings = data.recurrings || STATE.recurrings || [];
  STATE.recurringStatus = data.recurringStatus || STATE.recurringStatus;
  STATE.assetSnapshots = data.assetSnapshots || STATE.assetSnapshots || [];
  STATE.aiReady = data.aiReady || STATE.aiReady;
  STATE.aiHistory = data.aiHistory || STATE.aiHistory || [];
  STATE.closeHistory = data.closeHistory || STATE.closeHistory || [];
  STATE.insight = data.insight || STATE.insight;
  STATE.descDict = data.descDict || STATE.descDict || {};
}

function applyMonthData(data){
  if (!data) return;
  STATE.ym = data.ym || STATE.ym;
  STATE.summary = data.summary || STATE.summary;
  STATE.budget = data.budget || STATE.budget;
  STATE.recent = data.recent || STATE.recent || [];
  STATE.transactions = data.transactions || [];
  STATE.settlement = data.settlement || STATE.settlement;
  if (STATE.settlement && STATE.settlement.ym === STATE.ym) STATE.settlementDraft = loadSettlementDraft(STATE.ym);
  STATE.closeHistory = data.closeHistory || STATE.closeHistory || [];
  STATE.revision = Number(data.revision || STATE.revision || 0);
  STATE.lastSyncAt = Number(data.serverTime || Date.now());
}

function pendingAsTransaction(entry){
  const data = entry.data || {};
  return {
    row: 'temp_' + entry.clientId,
    clientId: entry.clientId,
    txId: entry.clientId,
    date: data.date,
    type: data.type,
    cat: data.cat,
    desc: data.desc || data.cat,
    amount: Number(data.amount || 0),
    fixed: data.fixed || '변동',
    user: data.user || STATE.sessionUser || '하콩',
    memo: data.memo || '',
    source: data.source || '',
    settlementBatch: data.settlementBatch || '',
    spendingMood: data.spendingMood || '',
    syncState: entry.lastError ? 'error' : 'pending'
  };
}

function mergePendingTransactions(){
  const existing = new Set([].concat(STATE.recent || [], STATE.transactions || []).map(t => String(t.clientId || t.txId || t.row)));
  (STATE.pending || []).forEach(entry => {
    const tx = pendingAsTransaction(entry);
    if (String(tx.date || '').slice(0, 7) !== STATE.ym) return;
    if (existing.has(entry.clientId) || existing.has(tx.row)) return;
    STATE.transactions.unshift(tx);
    STATE.recent.unshift(tx);
    existing.add(entry.clientId);
  });
  STATE.recent = (STATE.recent || []).slice(0, 20);
  renderSyncStatus();
}

function replacePendingTransaction(result){
  if (!result || !result.clientId || !result.transaction) return;
  ['recent', 'transactions'].forEach(key => {
    STATE[key] = (STATE[key] || []).map(t => {
      const id = String(t.clientId || t.txId || t.row || '');
      return (id === result.clientId || id === 'temp_' + result.clientId) ? result.transaction : t;
    });
  });
}

function queueTransaction(data){
  const entry = { clientId: createClientId(), data: data, createdAt: Date.now(), attempts: 0, lastError: '' };
  STATE.pending.push(entry);
  persistPendingQueue();
  return entry;
}

function flushPendingQueue(){
  if (STATE.sync.inFlight || !STATE.authToken || !(STATE.pending || []).length) return Promise.resolve();
  if (navigator.onLine === false) {
    renderSyncStatus('오프라인 · ' + STATE.pending.length + '건 안전하게 보관 중', 'pending');
    return Promise.resolve();
  }
  STATE.sync.inFlight = true;
  const batch = STATE.pending.slice(0, 50);
  batch.forEach(row => { row.attempts = Number(row.attempts || 0) + 1; });
  persistPendingQueue();
  renderSyncStatus(batch.length + '건 장부에 저장 중', 'syncing');
  return api('addTransactionsFast', batch.map(row => ({ clientId: row.clientId, data: row.data }))).then(res => {
    const completed = new Set();
    (res.results || []).forEach(result => {
      if (result && result.ok) {
        completed.add(result.clientId);
        replacePendingTransaction(result);
      }
    });
    STATE.pending = STATE.pending.filter(row => !completed.has(row.clientId));
    (res.results || []).forEach(result => {
      if (!result || result.ok) return;
      const row = STATE.pending.find(item => item.clientId === result.clientId);
      if (row) row.lastError = result.error || '저장 실패';
    });
    STATE.revision = Number(res.revision || STATE.revision || 0);
    persistPendingQueue();
    renderAll();
    renderSyncStatus(STATE.pending.length ? STATE.pending.length + '건 재시도 대기' : '장부 저장 완료', STATE.pending.length ? 'pending' : 'saved');
    if (completed.size) refreshVisibleMonth(true).catch(()=>{});
  }).catch(err => {
    batch.forEach(row => { row.lastError = (err && err.message) || '연결 실패'; });
    persistPendingQueue();
    renderAll();
    renderSyncStatus('연결되면 자동 재시도 · ' + STATE.pending.length + '건', 'pending');
  }).finally(() => {
    STATE.sync.inFlight = false;
    if (STATE.pending.length && navigator.onLine !== false) setTimeout(flushPendingQueue, 5000);
  });
}

function refreshBootData(silent){
  if (STATE.sync.bootPromise) return STATE.sync.bootPromise;
  const startedYm = STATE.ym;
  STATE.sync.bootPromise = api('getBoot').then(data => {
    saveBootCache(data);
    if (STATE.monthMode !== 'manual') applyBootData(data);
    else if (data.ym === startedYm) applyMonthData(data);
    else applyGlobalData(data);
    mergePendingTransactions();
    renderAll();
    if (!silent) toast('✅ 최신 장부로 동기화 완료');
    renderSyncStatus();
    return data;
  }).catch(err => {
    const text = (err && err.message) || '동기화 실패';
    if (/세션|로그인이 필요/.test(text)) {
      showLoginGate(text);
      return;
    }
    renderSyncStatus('오프라인 화면 · 변경사항은 기기에 보관', 'pending');
    if (!silent) toast(text, true);
  }).finally(() => {
    STATE.sync.bootPromise = null;
    flushPendingQueue();
  });
  return STATE.sync.bootPromise;
}

function refreshVisibleMonth(silent){
  if (!STATE.ym || !STATE.authToken) return Promise.resolve();
  const ym = STATE.ym;
  const requestId = ++STATE.requestSeq;
  return api('getMonthData', ym).then(data => {
    saveMonthCache(ym, data);
    if (requestId !== STATE.requestSeq || STATE.ym !== ym) return data;
    applyMonthData(data);
    mergePendingTransactions();
    renderAll();
    renderSyncStatus();
    if (!silent) toast('✅ ' + ym + ' 최신 데이터');
    return data;
  }).catch(err => {
    if (!silent) toast((err && err.message) || '데이터를 불러오지 못했어.', true);
    throw err;
  });
}

function renderFormChips(){
  const cfg = STATE.config || { types:['지출','수입','저축','대출상환'], byType:{} };
  const types = cfg.types || ['지출','수입','저축','대출상환'];

  const typeEl = document.getElementById('typeChips');
  if(typeEl){
    typeEl.innerHTML = types.map(t=>
      `<button type="button" class="chip ${currentType===t?'on':''}" onclick="selectFormChip('type','${t}')">${t}</button>`
    ).join('');
  }

  const catMap = cfg.byType || {};
  const cats = catMap[currentType] || ['식비','교통/차량','주거/통신','쇼핑/문화','경조/이벤트','건강/의료','용돈'];
  const currentCat = STATE.form.cat || cats[0] || '식비';
  if(!STATE.form.cat) STATE.form.cat = currentCat;
  const catEl = document.getElementById('catChips');
  if(catEl){
    catEl.innerHTML = cats.map(c=>
      `<button type="button" class="chip ${currentCat===c?'on':''}" onclick="selectFormChip('cat','${c}')">${emo(c)} ${c}</button>`
    ).join('');
  }

  const fixEl = document.getElementById('fixChips');
  if(fixEl){
    const fixes = ['변동','고정'];
    const currentFix = STATE.form.fixed || '변동';
    fixEl.innerHTML = fixes.map(f=>
      `<button type="button" class="chip ${currentFix===f?'on':''}" onclick="selectFormChip('fixed','${f}')">${f}</button>`
    ).join('');
  }

  const userEl = document.getElementById('userChips');
  if(userEl){
    const users = ['하콩', '지수'];
    const currentUser = STATE.form.user || '하콩';
    userEl.innerHTML = users.map(u=>
      `<button type="button" class="chip ${currentUser===u?'on':''}" onclick="selectFormChip('user','${u}')">${u==='지수'?'🧔 지수':'👧 하콩'}</button>`
    ).join('');
  }

  const moodEl = document.getElementById('moodChips');
  if(moodEl){
    const moods = ['필수소비','계획소비','충동소비','감성소비','투자성'];

      `<button type="button" class="chip ${currentMood===m?'on':''}" onclick="selectFormChip('mood','${m}')">${m}</button>`
    ).join('');

      ).join('');
      document.getElementById('templateField').style.display = '';
    } else {

    }

/* ============ 월초 일괄정산 작업대 ============ */
function settlementDraftState(){
  return settlementDraftForCurrent();
}

function settlementRowSeed(data){
  const source = data || {};
  return {
    clientId: source.clientId || createClientId(),
    date: source.date || lastDateOfYm(STATE.ym),
    source: source.source || '',
    type: source.type || '지출',
    cat: source.cat || '식비',
    desc: source.desc || '',
    amount: Number(source.amount || 0),
    fixed: source.fixed || '변동',
    user: source.user || STATE.sessionUser || '하콩',
    memo: source.memo || '',
    spendingMood: source.spendingMood || '',
    settlementBatch: source.settlementBatch || ''
  };
}

function persistSettlementDraftAndRender(){
  const draft = settlementDraftState();
  saveSettlementDraft(draft);
  renderHome();
}

function addSettlementDraftRow(data){
  const draft = settlementDraftState();
  draft.rows.push(settlementRowSeed(data));
  persistSettlementDraftAndRender();
}

function removeSettlementDraftRow(index){
  const draft = settlementDraftState();

}

function updateSettlementDraftRow(index, field, value){
  const draft = settlementDraftState();
  const row = draft.rows[Number(index)];
  if (!row) return;
  row[field] = value;
  saveSettlementDraft(draft);
}

function updateSettlementAmount(index, input){
  const raw = String(input.value || '').replace(/[^0-9]/g, '');
  input.value = raw ? Number(raw).toLocaleString('en-US') : '';
  updateSettlementDraftRow(index, 'amount', raw ? Number(raw) : 0);
}

function changeSettlementDraftType(index, type){
  const draft = settlementDraftState();
  const row = draft.rows[Number(index)];
  if (!row) return;
  row.type = type;
  const cats = settlementCategories(type, '');
  row.cat = cats[0] || '기타';
  persistSettlementDraftAndRender();
}

function loadRecurringSettlementDrafts(){
  const candidates = (STATE.settlement && STATE.settlement.recurringCandidates) || [];
  if (!candidates.length) return toast('불러올 정기거래 초안이 없어.');
  const draft = settlementDraftState();
  const existing = new Set([].concat(draft.rows || [], STATE.transactions || []).map(row => [row.date, row.desc, Number(row.amount || 0)].join('|')));
  let added = 0;
  candidates.forEach(candidate => {
    const key = [candidate.date, candidate.desc, Number(candidate.amount || 0)].join('|');
    if (existing.has(key)) return;
    draft.rows.push(settlementRowSeed(candidate));
    existing.add(key);
    added++;
  });
  saveSettlementDraft(draft);
  renderHome();
  toast(added ? '정기거래 초안 '+added+'건을 가져왔어.' : '이미 입력됐거나 초안에 있는 정기거래야.');
}

function importSettlementPaste(){
  const box = document.getElementById('settlementPaste');
  const text = box ? String(box.value || '').trim() : '';
  if (!text) return toast('붙여넣을 내역이 없어.', true);
  const draft = settlementDraftState();
  let added = 0, skipped = 0;
  text.split(/\r?\n/).forEach(line => {
    const cols = line.split('\t').map(v => v.trim());
    if (cols.length < 3) { skipped++; return; }
    let date = cols[0];
    let source = '', desc = '', amount = '';
    if (cols.length >= 4) { source = cols[1]; desc = cols[2]; amount = cols[3]; }
    else { desc = cols[1]; amount = cols[2]; }
    if (/^\d{1,2}[./-]\d{1,2}$/.test(date)) {
      const p = date.split(/[./-]/); date = String(STATE.ym).slice(0,4)+'-'+pad(p[0])+'-'+pad(p[1]);
    }
    const number = Number(String(amount).replace(/[^0-9.-]/g,''));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !desc || !(Math.abs(number) > 0)) { skipped++; return; }
    draft.rows.push(settlementRowSeed({ date, source, desc, amount:Math.abs(number) }));
    added++;
  });
  if (box) box.value = '';
  saveSettlementDraft(draft);
  renderHome();
  toast(added+'건을 초안에 넣었어.' + (skipped ? ' 형식이 맞지 않은 '+skipped+'건은 제외했어.' : ''), skipped > 0);
}

function applySettlementResponse(data){
  if (!data) return;
  STATE.settlement = data;
  STATE.settlement.showWorkspace = !data.isClosed && STATE.ym !== (STATE.currentYm || todayStr().slice(0,7));
  STATE.settlementDraft = loadSettlementDraft(STATE.ym);
}

function submitSettlementDraft(){
  const draft = settlementDraftState();
  const rows = (draft.rows || []).slice();
  if (!rows.length) return;
  const invalid = rows.find(row => !/^\d{4}-\d{2}-\d{2}$/.test(String(row.date || '')) || !String(row.desc || '').trim() || !(Number(row.amount || 0) > 0));
  if (invalid) return toast('날짜 · 내역 · 금액이 비어 있는 초안이 있어.', true);
  const batchId = 'settlement_' + STATE.ym + '_' + Date.now();
  const pending = rows.slice();
  const completed = new Set();
  const submitBtnText = '정산 거래 저장 중…';
  renderSyncStatus(submitBtnText, 'syncing');
  const sendNext = () => {
    if (!pending.length) return Promise.resolve();
    const chunk = pending.splice(0, 50);
    return api('addTransactionsFast', chunk.map(row => ({
      clientId: row.clientId,
      data: Object.assign({}, row, { settlementBatch: batchId })
    }))).then(res => {
      (res.results || []).forEach(result => { if (result && result.ok) completed.add(result.clientId); });
      return sendNext();
    });
  };
  sendNext().then(() => {
    draft.rows = rows.filter(row => !completed.has(row.clientId));
    saveSettlementDraft(draft);
    return refreshVisibleMonth(true);
  }).then(() => {
    toast(completed.size+'건을 장부에 확정 저장했어.');
    renderSyncStatus('월정산 거래 저장 완료', 'saved');
  }).catch(err => {
    toast((err && err.message) || '일부 거래를 저장하지 못했어. 초안은 그대로 남아 있어.', true);
    renderSyncStatus('정산 초안 저장 실패 · 다시 시도 가능', 'pending');
  });
}

    // 1. 낙관적 UI 즉시 수정
    if (isMonthChanged) {
      STATE.recent = STATE.recent.filter(t => String(t.row) !== String(editRow));
      STATE.transactions = (STATE.transactions || []).filter(t => String(t.row) !== String(editRow));
    } else {
      const idx = STATE.recent.findIndex(t => String(t.row) === String(editRow));
      const updatedTx = { ...oldTx, date, type, cat, amount: amtNum, desc: desc || cat, fixed, user, memo };
      if (idx > -1) STATE.recent[idx] = updatedTx;
      const idx2 = (STATE.transactions || []).findIndex(t => String(t.row) === String(editRow));
      if (idx2 > -1) STATE.transactions[idx2] = updatedTx;
    }

    // 요약 수치 조정 (구-신 차이 반영)
    if (STATE.summary) {
      const oldAmt = Number(oldTx.amount || 0);
      if (oldTx.type === '지출') {
        STATE.summary.expense = Math.max(0, (STATE.summary.expense || 0) - oldAmt);
        STATE.summary.left = (STATE.summary.left || 0) + oldAmt;
      } else if (oldTx.type === '수입') {
        STATE.summary.income = Math.max(0, (STATE.summary.income || 0) - oldAmt);
        STATE.summary.left = Math.max(0, (STATE.summary.left || 0) - oldAmt);
      } else if (oldTx.type === '저축') {
        STATE.summary.save = Math.max(0, (STATE.summary.save || 0) - oldAmt);
        STATE.summary.left = (STATE.summary.left || 0) + oldAmt;
      } else if (oldTx.type === '대출상환') {
        STATE.summary.repay = Math.max(0, (STATE.summary.repay || 0) - oldAmt);
        STATE.summary.left = (STATE.summary.left || 0) + oldAmt;
      }

      if (!isMonthChanged) {
        if (type === '지출') {
          STATE.summary.expense = (STATE.summary.expense || 0) + amtNum;
          STATE.summary.left = (STATE.summary.left || 0) - amtNum;
        } else if (type === '수입') {
          STATE.summary.income = (STATE.summary.income || 0) + amtNum;
          STATE.summary.left = (STATE.summary.left || 0) + amtNum;
        } else if (type === '저축') {
          STATE.summary.save = (STATE.summary.save || 0) + amtNum;
          STATE.summary.left = (STATE.summary.left || 0) - amtNum;
        } else if (type === '대출상환') {
          STATE.summary.repay = (STATE.summary.repay || 0) + amtNum;
          STATE.summary.left = (STATE.summary.left || 0) - amtNum;
        }
      }
    }

    renderAll();
    toast('✏️ 거래 수정 완료!');
    if (closeAfter) closeQuickEntryModal();
    else if(amtInp) { amtInp.value = ''; amtInp.focus(); }

    // 백그라운드 수정 API 호출
    const txData = { date, type, cat, amount: amtNum, desc: desc || cat, fixed, user, memo, spendingMood: mood };
    api('updateTransaction', editRow, txData, STATE.ym).then(data => {
      if (data && data.summary) {
        STATE.summary = data.summary;
        if (data.recent) STATE.recent = data.recent;
        if (data.transactions) STATE.transactions = data.transactions;
        renderAll();
      }
    }).catch(err => {
      toast((err && err.message) || '⚠️ 수정 동기화 실패', true);
    });
    return;
  }

  // ===== 신규 추가 모드 =====
  // 1. 낙관적 가상 트랜잭션 즉시 생성 (0.001초)
  const syntheticTx = {
    row: 'temp_' + Date.now(),
    date, type, cat, amount: amtNum,
    desc: desc || cat || '지출',
    fixed, user, memo
  };

  // 2. 로컈 상태 즉시 반영 (Wait Time = 0ms)
  STATE.recent.unshift(syntheticTx);
  if (STATE.summary) {
    const isMonthChanged = STATE.ym && date.slice(0, 7) !== STATE.ym;
    if (!isMonthChanged) {
      if (type === '지출') {
        STATE.summary.expense = (STATE.summary.expense || 0) + amtNum;
        STATE.summary.left = (STATE.summary.left || 0) - amtNum;
      } else if (type === '수입') {
        STATE.summary.income = (STATE.summary.income || 0) + amtNum;
        STATE.summary.left = (STATE.summary.left || 0) + amtNum;
      } else if (type === '저축') {
        STATE.summary.save = (STATE.summary.save || 0) + amtNum;
        STATE.summary.left = (STATE.summary.left || 0) - amtNum;
      } else if (type === '대출상환') {
        STATE.summary.repay = (STATE.summary.repay || 0) + amtNum;
        STATE.summary.left = (STATE.summary.left || 0) - amtNum;
      }
    }
  }

  // 3. UI 0.001초 대기 없이 즉시 재렌더링
  renderAll();
  toast('⚡ 0.001초 빠른 저장 완료!');

  const txRowData = { date, type, cat, amount: amtNum, desc: syntheticTx.desc, fixed, user, memo, spendingMood: mood };
  api('addTransactionsFast', [txRowData]).then(res => {
  }).catch(err => {

  });

function adjustSummaryOptimistic(tx, direction){
  if (!STATE.summary || String(tx.date || '').slice(0, 7) !== STATE.ym) return;
  const amount = Number(tx.amount || 0) * Number(direction || 1);
  if (tx.type === '지출') {
    STATE.summary.expense = Math.max(0, Number(STATE.summary.expense || 0) + amount);
    STATE.summary.left = Number(STATE.summary.left || 0) - amount;
    const cats = STATE.summary.cats || (STATE.summary.cats = []);
    let row = cats.find(item => item.cat === tx.cat);
    if (!row && amount > 0) { row = { cat: tx.cat, amt: 0 }; cats.push(row); }
    if (row) row.amt = Math.max(0, Number(row.amt || 0) + amount);
    STATE.summary.cats = cats.filter(item => Number(item.amt || 0) > 0).sort((a,b) => b.amt - a.amt);
  } else if (tx.type === '수입') {
    STATE.summary.income = Math.max(0, Number(STATE.summary.income || 0) + amount);
    STATE.summary.left = Number(STATE.summary.left || 0) + amount;
  } else if (tx.type === '저축') {
    STATE.summary.save = Math.max(0, Number(STATE.summary.save || 0) + amount);
    STATE.summary.left = Number(STATE.summary.left || 0) - amount;
  } else if (tx.type === '대출상환') {
    STATE.summary.repay = Math.max(0, Number(STATE.summary.repay || 0) + amount);
    STATE.summary.left = Number(STATE.summary.left || 0) - amount;
  }
}

function changeMonth(delta){
  if(!STATE.ym) return;
  const parts = STATE.ym.split('-');

  else if (m > 12) { y++; m = 1; }
  const newYm = y + '-' + pad(m);

  const requestId = ++STATE.requestSeq;
  STATE.monthMode = 'manual';
  STATE.list.pageSize = 40;
  const cached = loadMonthCache(newYm);
  STATE.ym = newYm;
  if (cached) {
    applyMonthData(cached);
    mergePendingTransactions();
    renderAll();
    renderSyncStatus(newYm + ' 저장된 화면 · 최신 확인 중', 'syncing');
  } else {
    document.getElementById('mLabel').textContent = newYm;
    renderSyncStatus(newYm + ' 불러오는 중', 'syncing');
  }

    saveMonthCache(newYm, data);
    if (requestId !== STATE.requestSeq || STATE.ym !== newYm) return;
    applyMonthData(data);
    mergePendingTransactions();
    renderAll();
    renderSyncStatus();
  }).catch(err => {
    if (!cached) toast((err && err.message) || '데이터를 불러오지 못했어.', true);
    renderSyncStatus(cached ? '저장된 화면 · 오프라인' : '불러오기 실패', 'pending');
