function renderCloseMonthPreview(p){
  const s=p.summary||{}, b=p.budget||{}, a=p.assets||{total:0}, copy=p.copyBudget||{};
  const anomalies=p.anomalies||[];
  const over=(b.items||[]).filter(it=>it.left<0).slice(0,3).map(it=>`${it.category} ${fmt(Math.abs(it.left))} 초과`).join(' · ');
  const anomalyHtml=anomalies.length ? `<div class="close-anomalies">${anomalies.slice(0,5).map(x=>
    `<div class="close-anomaly">행 ${esc(x.row||'-')} · ${esc(x.category||'-')} · ${fmt(x.amount||0)}<br>${esc(x.message||'확인이 필요한 거래야')}</div>`).join('')}</div>`
    : `<div class="close-preview-note">확인 필요한 이상지출 후보가 없어요.</div>`;
  const closedHtml=p.hasCloseRecord ? `<div class="close-result on warn">이미 마감 기록이 있어요. 재마감하면 기존 기록은 두고 새 행으로 추가해요.</div>` : '';
  document.getElementById('closeMonthBody').innerHTML = `
    ${closedHtml}
    <div class="close-preview-note"><strong>${esc(p.ym)}</strong> 마감 미리보기</div>
    <div class="close-metrics">
      <div class="close-metric"><div class="l">총수입</div><div class="v">${fmt(s.income||0)}</div></div>
      <div class="close-metric"><div class="l">총지출</div><div class="v">${fmt(s.expense||0)}</div></div>
      <div class="close-metric"><div class="l">남은돈</div><div class="v">${fmt(s.left||0)}</div></div>
      <div class="close-metric"><div class="l">저축률</div><div class="v">${esc(s.savingRate||0)}%</div></div>
      <div class="close-metric"><div class="l">고정비</div><div class="v">${fmt(s.fixedExpense||0)}</div></div>
      <div class="close-metric"><div class="l">변동비</div><div class="v">${fmt(s.variableExpense||0)}</div></div>
      <div class="close-metric"><div class="l">총자산</div><div class="v">${fmt(a.total||0)}</div></div>
      <div class="close-metric"><div class="l">확인 필요</div><div class="v">${anomalies.length}건</div></div>
    </div>
    <div class="close-preview-note">예산 ${b.hasBudget?`사용률 ${b.totalBudget?Math.round((b.totalSpent||0)/(b.totalBudget||1)*100):0}% · 남은 예산 ${fmt(b.totalLeft||0)}`:'미설정'}${over?` · ${esc(over)}`:''}</div>
    ${anomalyHtml}
    <div class="close-preview-note">다음 달(${esc(copy.toYm||shiftYm(STATE.ym,1))}) 예산 ${copy.nextBudgetExists?'이미 있음':'없음'} · 현재 월 예산 ${copy.currentCount||0}개</div>`;
}
function syncCloseOptions(p){
  const ai=document.getElementById('closeRunAi');
  const copy=document.getElementById('closeCopyBudget');
  const overwriteWrap=document.getElementById('closeOverwriteWrap');
  const overwrite=document.getElementById('closeOverwriteBudget');
  const aiHint=document.getElementById('closeAiHint');
  const budgetHint=document.getElementById('closeBudgetHint');
  const info=(p&&p.copyBudget)||{};
  ai.checked=!!(p&&p.aiReady);
  ai.disabled=!(p&&p.aiReady);
  aiHint.textContent=(p&&p.aiReady) ? 'AI 코칭을 실행하고 요약을 마감 기록에 남겨요.' : 'AI 키가 없어 AI 분석은 건너뛸게요.';
  copy.checked=!!info.hasCurrentBudget;
  copy.disabled=!info.hasCurrentBudget;
  budgetHint.textContent=info.hasCurrentBudget ? `${info.toYm} 예산으로 복사해요.` : '현재 월 예산이 없어 복사할 항목이 없어요.';
  function updateOverwrite(){
    const show=copy.checked && !!info.nextBudgetExists;
    overwriteWrap.style.display=show?'':'none';
    if(!show) overwrite.checked=false;
  }
  copy.onchange=updateOverwrite;
  updateOverwrite();
}
function showCloseResult(msg, warn){
  const box=document.getElementById('closeResult');
  box.className='close-result on'+(warn?' warn':'');
  box.innerHTML=msg;
}
function openCloseMonth(){
  document.getElementById('overlay').classList.add('on');
  document.getElementById('closeMonthSheet').classList.add('on');
  document.getElementById('closeResult').className='close-result';
  document.getElementById('closeResult').innerHTML='';
  document.getElementById('closeMemo').value=document.getElementById('closeMemo').value || `${STATE.ym} 마감`;
  document.getElementById('closeMonthBody').innerHTML='<div class="empty"><span class="spinner" style="border-color:#ccc;border-top-color:#2f5233"></span></div>';
  const btn=document.getElementById('closeRunBtn');
  btn.disabled=true; btn.textContent='월정리 저장';
  api('getCloseMonthPreview', STATE.ym).then(p=>{
    STATE.closePreview=p;
    renderCloseMonthPreview(p);
    syncCloseOptions(p);
    btn.disabled=false;
  }).catch(e=>{
    btn.disabled=false;
    document.getElementById('closeMonthBody').innerHTML=`<div class="empty"><span class="e">⚠️</span>${esc(e.message||'마감 미리보기를 불러오지 못했어')}</div>`;
  });
}
function closeCloseMonthSheet(){
  document.getElementById('closeMonthSheet').classList.remove('on');
  if(!document.getElementById('sheet').classList.contains('on') && !document.getElementById('budgetSheet').classList.contains('on')) {
    document.getElementById('overlay').classList.remove('on');
  }
}
function runCloseMonth(){
  const p=STATE.closePreview;
  const copyInfo=(p&&p.copyBudget)||{};
  const copyChecked=document.getElementById('closeCopyBudget').checked;
  const overwriteChecked=document.getElementById('closeOverwriteBudget').checked;
  if(copyChecked && copyInfo.nextBudgetExists && !overwriteChecked){
    showCloseResult('다음 달 예산이 이미 있어요. 덮어쓸까요?', true);
    document.getElementById('closeOverwriteWrap').style.display='';
    return;
  }
  const btn=document.getElementById('closeRunBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 정리 중…';
  const options={
    ym: STATE.ym,
    user: document.getElementById('closeUser').value.trim(),
    memo: document.getElementById('closeMemo').value.trim(),
    saveAssetSnapshot: document.getElementById('closeSaveAsset').checked,
    runAi: document.getElementById('closeRunAi').checked && !document.getElementById('closeRunAi').disabled,
    copyBudgetToNextMonth: copyChecked,
    createBackup: document.getElementById('closeCreateBackup').checked,
    overwriteNextBudget: overwriteChecked
  };
  api('closeMonth', options).then(r=>{
    btn.disabled=false; btn.textContent='월정리 저장';
    if(r.needsOverwriteNextBudget){
      showCloseResult(esc(r.message||'다음 달 예산이 이미 있어요. 덮어쓸까요?'), true);
      document.getElementById('closeOverwriteWrap').style.display='';
      return;
    }
    STATE.closeHistory=r.history || STATE.closeHistory || [];
    if(r.assetSnapshots) STATE.assetSnapshots=r.assetSnapshots;
    if(r.aiHistory){ STATE.aiHistory=r.aiHistory; STATE.aiCurrent=(STATE.aiHistory||[]).find(h=>h.ym===STATE.ym)||STATE.aiCurrent; }
    if(r.backup) STATE.backupInfo=r.backup;
    if(r.insight) STATE.insight=r.insight;
    const done=(r.actions||[]).join(', ') || '월마감 기록 저장';
    const warns=(r.warnings||[]).map(esc).join('<br>');
    showCloseResult(`월정리 저장 완료: ${esc(done)}${warns?`<br>${warns}`:''}`, !!warns);
    renderReview();
    renderAi();
    toast('월정리를 저장했어');
  }).catch(e=>{
    btn.disabled=false; btn.textContent='월정리 저장';
    showCloseResult(esc(e.message||'월정리를 저장하지 못했어'), true);
    toast(e.message||'월정리를 저장하지 못했어', true);
  });
}
function renderReview(){
  const el=document.getElementById('v-review');
  if(!el) return;
  loadMonthlyReview(false);
  const r=STATE.monthlyReview;
  if(STATE.monthlyReviewLoading || !r || r.ym!==STATE.ym){
    el.innerHTML = `<div class="empty"><span class="spinner" style="border-color:#ccc;border-top-color:#2f5233"></span></div>`;
    return;
  }
  if(r.error){
    el.innerHTML = `<div class="empty"><span class="e">⚠️</span>${esc(r.error)}</div>`;
    return;
  }
  el.innerHTML = `<button class="more-back" onclick="switchView('more')">‹ 더보기</button>
    <div class="sec-title">월정리</div>
    <div class="ai-note">이번 달 숫자를 확인하고, 좋았던 소비와 다음 달 약속을 둘이 함께 남기는 공간이에요.</div>`
    + renderCloseMonthCard()
    + `<div class="review-layout">${renderReviewSummary(r)}<div>${renderReviewChecks(r)}${renderReviewForm()}</div></div>`
    + renderReviewHistory(r);
  const reviewBtn=document.getElementById('reviewSaveBtn');
  if(reviewBtn) reviewBtn.addEventListener('click', saveMonthlyReviewUi);
  const closeBtn=document.getElementById('closeOpenBtn');
  if(closeBtn) closeBtn.addEventListener('click', openCloseMonth);
}

function renderAi(){
  const el=document.getElementById('v-ai');
  if(!el) return;
  const current=(STATE.aiCurrent&&STATE.aiCurrent.ym===STATE.ym)
    ? STATE.aiCurrent
    : (STATE.aiHistory||[]).find(h=>h.ym===STATE.ym);
  const currentHtml=current
    ? `<div class="ai-card"><div class="meta"><span class="ym">${esc(current.ym)}</span> ${esc(current.when||'')}</div><div class="body">${esc(current.coaching||'')}</div></div>`
    : `<div class="empty"><span class="e">🤖</span>${STATE.ym} AI 분석 결과가 아직 없어</div>`;
  const history=(STATE.aiHistory||[]).filter(h=>!current || h!==current);
  const histHtml=history.length ? history.map(h=>`<div class="ai-card"><div class="meta"><span class="ym">${esc(h.ym)}</span> ${esc(h.when||'')}</div><div class="body">${esc(h.coaching||'')}</div></div>`).join('')
    : `<div class="empty"><span class="e">📭</span>지난 AI 분석 기록이 없어</div>`;

  el.innerHTML=`<button class="more-back" onclick="switchView('more')">‹ 더보기</button>
    <div class="sec-title">AI 가계부 분석</div>
    <div class="card">
      <div class="ai-pick"><div class="m">${esc(STATE.ym)}</div><button class="ai-run" id="aiRun" ${STATE.aiReady?'':'disabled'}>🤖 AI 분석 시작</button></div>
      <div class="ai-note">이번 달 수입·지출·예산·고정비·변동비·입력자별 특징을 읽고 다음 달 행동까지 정리해줘요.${STATE.aiReady?'':' 현재 GROQ_API_KEY가 없어 버튼이 꺼져 있어요.'}</div>
    </div>
    <div class="sec-title">이번 달 분석 결과</div>${currentHtml}
    <div class="sec-title">지난 분석 기록</div>${histHtml}`;
  const runBtn=document.getElementById('aiRun');
  if(runBtn && STATE.aiReady) runBtn.addEventListener('click', runAi);
}

function runAi(){
  const btn=document.getElementById('aiRun');
  btn.disabled=true; btn.innerHTML='<span class="spinner dark"></span> 분석 중…';
  api('runAiAnalysis', STATE.ym).then(r=>{
    const item={when:r.when, ym:r.ym, coaching:r.coaching, snapshot:r.snapshot};
    STATE.aiCurrent=item;
    STATE.aiHistory=(STATE.aiHistory||[]).filter(h=>!(h.ym===item.ym&&h.when===item.when));
    STATE.aiHistory.unshift(item);
    renderAi(); toast('AI 분석을 완료했어 🤖');
  }).catch(e=>{ btn.disabled=false; btn.innerHTML='🤖 AI 분석 시작'; toast(e.message||'AI 분석을 완료하지 못했어', true); });
}
function createBackup(){
  const btn=document.getElementById('backupBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 만드는 중…';
  api('createBackup').then(r=>{
    STATE.backupInfo=r;
    renderRecurring();
    refreshHomeInsight();
    toast('백업을 만들었어');
  }).catch(e=>{ btn.disabled=false; btn.textContent='백업 만들기'; toast(e.message||'백업을 만들지 못했어', true); });
}

/* ============ 입력 시트 ============ */
function renderTemplateChips(){
  const field=document.getElementById('templateField');
  const box=document.getElementById('templateChips');
  const templates=STATE.templates||[];
  if(!templates.length){ field.style.display='none'; box.innerHTML=''; return; }
  field.style.display='';
  box.innerHTML = templates.map(t=>
    `<button class="template-chip" onclick="applyTemplate('${String(t.name).replace(/'/g,"\\'")}')">${esc(t.name)}</button>`).join('');
}
function applyTemplate(name){
  const t=(STATE.templates||[]).find(x=>x.name===name);
  if(!t) return;
  STATE.form.type=t.type || STATE.form.type;
  STATE.form.cat=t.cat || STATE.form.cat;
  STATE.form.fixed=t.fixed || '변동';
  STATE.form.catManual=false;
  STATE.form.moodManual=false;
  document.getElementById('fDesc').value=t.desc||'';
  document.getElementById('fAmount').value=t.amount>0?comma(t.amount):'';
  document.getElementById('fMemo').value=t.memo||'웹앱';
  suggestMood();
  renderTypeChips(); renderCatChips(); renderMoodChips(); renderFixUser(); renderRecommendation();
}
function typeForCategory(cat){
  const by=STATE.config.byType||{};
  const found=Object.keys(by).find(t=>(by[t]||[]).indexOf(cat)>-1);
  return found || STATE.form.type || '지출';
}
function recommendCategory(desc){
  const text=String(desc||'').toLowerCase();
  if(!text) return '';
  for(const rule of KEYWORD_RULES){
    if(rule.words.some(w=>text.indexOf(String(w).toLowerCase())>-1)){
      const cats=allFilterCats();
      return rule.cats.find(c=>cats.indexOf(c)>-1) || rule.cats[0] || '';
    }
  }
  return '';
}
function normalizeMood(mood){
  return SPENDING_MOOD_OPTIONS.indexOf(mood)>-1 ? mood : '미지정';
}
function recommendMood(cat, desc){
  const text=(String(cat||'')+' '+String(desc||'')).toLowerCase();
  if(!text.trim()) return '미지정';
  for(const rule of MOOD_RULES){
    if(rule.words.some(w=>text.indexOf(String(w).toLowerCase())>-1)) return rule.mood;
  }
  return '미지정';
}
function suggestMood(){
  if(STATE.form.moodManual) return;
  STATE.form.spendingMood = recommendMood(STATE.form.cat, document.getElementById('fDesc').value);
}
function renderRecommendation(){
  const box=document.getElementById('recommendBox');
  const desc=document.getElementById('fDesc').value;
  const cat=recommendCategory(desc);
  STATE.form.recommendedCat=cat;
  if(!cat || cat===STATE.form.cat){ box.className='recommend-box'; box.innerHTML=''; return; }
  box.className='recommend-box on';
  box.innerHTML=`<button class="recommend-btn" onclick="applyRecommendation('${cat.replace(/'/g,"\\'")}')">추천: ${esc(cat)}</button>`;
}
function applyRecommendation(cat){
  STATE.form.type=typeForCategory(cat);
  STATE.form.cat=cat;
  STATE.form.catManual=true;
  suggestMood();
  renderTypeChips(); renderCatChips(); renderMoodChips(); renderRecommendation();
}
function renderTypeChips(){
  const box=document.getElementById('typeChips');
  const types = (STATE.config.types||[]).slice();
  if(STATE.form.type && types.indexOf(STATE.form.type)===-1) types.unshift(STATE.form.type);
  box.innerHTML = types.map(t=>
    `<button class="chip ${STATE.form.type===t?'on':''}" onclick="pickType('${t}')">${t}</button>`).join('');
}
function renderCatChips(){
  const box=document.getElementById('catChips');
  const cats = STATE.form.type? (STATE.config.byType[STATE.form.type]||[]).slice() : [];
  if(STATE.form.cat && cats.indexOf(STATE.form.cat)===-1) cats.unshift(STATE.form.cat);
  if(!cats.length){ box.innerHTML=`<span style="color:var(--muted);font-size:13px">구분을 먼저 골라줘</span>`; return; }
  box.innerHTML = cats.map(c=>
    `<button class="chip sub ${STATE.form.cat===c?'on':''}" onclick="pickCat('${c.replace(/'/g,"\\'")}')">${emo(c)} ${esc(c)}</button>`).join('');
}
function renderMoodChips(){
  const box=document.getElementById('moodChips');
  if(!box) return;
  const selected=normalizeMood(STATE.form.spendingMood);
  box.innerHTML = SPENDING_MOODS.map(m=>
    `<button class="chip sub ${selected===m?'on':''}" onclick="pickMood('${m}')">${esc(m)}</button>`).join('');
  const hint=document.getElementById('moodHint');
  if(hint) hint.textContent = MOOD_HINTS[selected] || MOOD_HINTS['미지정'];
}
function pickType(t){
  STATE.form.type=t;
  const cats = STATE.config.byType[t]||[];
  STATE.form.cat = cats.length===1 ? cats[0] : null;  // 저축/대출상환 자동선택
  STATE.form.catManual=false;
  suggestMood();
  renderTypeChips(); renderCatChips();
  renderMoodChips();
  renderRecommendation();
}
function pickCat(c){
  STATE.form.cat=c;
  STATE.form.catManual=true;
  suggestMood();
  renderCatChips();
  renderMoodChips();
  renderRecommendation();
}
function pickMood(m){
  STATE.form.spendingMood = (STATE.form.spendingMood===m ? '미지정' : normalizeMood(m));
  STATE.form.moodManual = STATE.form.spendingMood !== '미지정';
  renderMoodChips();
}

function renderFixUser(){
  document.getElementById('fixChips').innerHTML = ['변동','고정'].map(f=>
    `<button class="chip ${STATE.form.fixed===f?'on':''}" onclick="pickFix('${f}')">${f}</button>`).join('');
  document.getElementById('userChips').innerHTML = ['지수','하콩'].map(u=>
    `<button class="chip ${STATE.form.user===u?'on':''}" onclick="pickUser('${u}')">${u}</button>`).join('');
}
function pickFix(f){ STATE.form.fixed=f; renderFixUser(); }
function pickUser(u){ STATE.form.user = (STATE.form.user===u?'':u); if(STATE.form.user) localStorage.setItem(PREFERRED_USER_KEY,STATE.form.user); else localStorage.removeItem(PREFERRED_USER_KEY); renderFixUser(); }

function openSheet(tx){
  if(tx && tx.currentTarget && tx.type==='click') tx=null;
  const editing = !!tx;
  STATE.editing = editing ? tx : null;
  document.getElementById('sheetTitle').textContent = editing ? '거래 수정' : '빠른 입력';
  const btn=document.getElementById('submitBtn');
  const continueBtn=document.getElementById('continueBtn');
  const actions=document.getElementById('txSheetActions');
  btn.disabled=false;
  btn.textContent = editing ? '저장하기' : '추가 후 닫기';
  continueBtn.style.display=editing?'none':'';
  continueBtn.disabled=false;
  actions.classList.toggle('editing',editing);
  if(editing){
    STATE.form.type = tx.type || STATE.config.types[0] || null;
    STATE.form.cat = tx.cat || null;
    STATE.form.fixed = tx.fixed || '변동';
    STATE.form.user = tx.user || '';
    STATE.form.catManual = true;
    STATE.form.spendingMood = normalizeMood(tx.spendingMood || tx.meaning || '미지정');
    STATE.form.moodManual = STATE.form.spendingMood !== '미지정';
    document.getElementById('fAmount').value=comma(tx.amount);
    document.getElementById('fDesc').value=tx.desc||'';
    document.getElementById('fMemo').value=tx.memo||'';
    document.getElementById('fDate').value=tx.date||todayStr();
  } else {
    STATE.form.type = STATE.config.types[0]||null;
    const cats = STATE.form.type? (STATE.config.byType[STATE.form.type]||[]):[];
    STATE.form.cat = cats.length===1? cats[0]:null;
    STATE.form.fixed='변동';
    STATE.form.user=STATE.form.user||'';
    STATE.form.catManual=false;
    STATE.form.spendingMood='미지정';
    STATE.form.moodManual=false;
    document.getElementById('fAmount').value='';
    document.getElementById('fDesc').value='';
    document.getElementById('fMemo').value='';
    document.getElementById('fDate').value=todayStr();
    suggestMood();
  }
  renderTemplateChips(); renderTypeChips(); renderCatChips(); renderMoodChips(); renderFixUser(); renderRecommendation();
  document.getElementById('overlay').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  setTimeout(()=>{
    const amtInp = document.getElementById('fAmount');
    amtInp.focus();
    if(amtInp.setSelectionRange) amtInp.setSelectionRange(amtInp.value.length, amtInp.value.length);
  }, 100);
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('on');
  if(!document.getElementById('budgetSheet').classList.contains('on') && !document.getElementById('closeMonthSheet').classList.contains('on')) document.getElementById('overlay').classList.remove('on');
  STATE.editing=null;
}
function closeAllSheets(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('budgetSheet').classList.remove('on');
  document.getElementById('closeMonthSheet').classList.remove('on');
  document.getElementById('overlay').classList.remove('on');
  STATE.editing=null;
}
function formatCommaInput(inp){
  const v=inp.value.replace(/[^0-9]/g,'');
  inp.value = v? Number(v).toLocaleString('en-US') : '';
}
function makeClientTxId(){
  if(window.crypto && crypto.randomUUID) return 'WEB-'+crypto.randomUUID();
  return 'WEB-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);
}
function persistFastQueue(){
  try{
    const rows=(STATE.queue.items||[]).filter(x=>x.status!=='saved').map(x=>({
      clientId:x.clientId,data:x.data,status:x.status==='saving'?'pending':x.status,attempts:x.attempts||0,error:x.error||'',createdAt:x.createdAt||Date.now()
    }));
    localStorage.setItem(FAST_QUEUE_KEY,JSON.stringify(rows));
  }catch(e){}
}
function restoreFastQueue(){
  try{
    const rows=JSON.parse(localStorage.getItem(FAST_QUEUE_KEY)||'[]');
    STATE.queue.items=Array.isArray(rows)?rows.map(x=>({
      clientId:x.clientId||makeClientTxId(),data:x.data||{},status:x.status==='failed'?'failed':'pending',attempts:Number(x.attempts)||0,error:x.error||'',createdAt:x.createdAt||Date.now()
    })):[];
  }catch(e){ STATE.queue.items=[]; }
}
let syncHideTimer;
function renderSyncStatus(doneMessage){
  const box=document.getElementById('syncStatus');
  if(!box) return;
  clearTimeout(syncHideTimer);
  const items=STATE.queue.items||[];
  const failed=items.filter(x=>x.status==='failed').length;
  const active=items.filter(x=>x.status==='pending'||x.status==='saving').length;
  if(failed){
    box.className='on err';
    box.innerHTML=`⚠ ${failed}건 저장 실패 <button onclick="retryFailedQueue()">재시도</button><button onclick="discardFailedQueue()">삭제</button>`;
    return;
  }
  if(active || STATE.queue.flushing){
    box.className='on';
    box.innerHTML=`<span class="spinner" style="border-color:rgba(47,82,51,.25);border-top-color:#2f5233"></span> ${Math.max(active,1)}건 저장 중…`;
    return;
  }
  if(doneMessage){
    box.className='on'; box.textContent=doneMessage;
    syncHideTimer=setTimeout(()=>{ box.className=''; },1600);
  }else box.className='';
}
function retryFailedQueue(){
  (STATE.queue.items||[]).forEach(x=>{ if(x.status==='failed'){ x.status='pending'; x.attempts=0; x.error=''; } });
  persistFastQueue(); renderSyncStatus(); scheduleQueueFlush(50);
}
function discardFailedQueue(){
  STATE.queue.items=(STATE.queue.items||[]).filter(x=>x.status!=='failed');
  persistFastQueue(); renderSyncStatus();
}
function scheduleQueueFlush(delay){
  clearTimeout(STATE.queue.flushTimer);
  STATE.queue.flushTimer=setTimeout(flushFastQueue,delay==null?220:delay);
}
function enqueueFastTransaction(data,keepOpen){
  STATE.queue.items.push({clientId:makeClientTxId(),data:data,status:'pending',attempts:0,error:'',createdAt:Date.now()});
  persistFastQueue(); renderSyncStatus();
  if(keepOpen) resetQuickEntryForm(); else closeSheet();
  toast(keepOpen?'추가했어 · 다음 내역 입력해줘 ✅':'추가했어 · 저장 중 ✅');
  scheduleQueueFlush(120);
}
function resetQuickEntryForm(){
  document.getElementById('fAmount').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fMemo').value='';
  STATE.form.spendingMood='미지정'; STATE.form.moodManual=false;
  suggestMood(); renderMoodChips(); renderRecommendation();
  setTimeout(()=>document.getElementById('fAmount').focus(),30);
}
function flushFastQueue(){
  if(STATE.queue.flushing) return;
  const batch=(STATE.queue.items||[]).filter(x=>x.status==='pending').slice(0,20);
  if(!batch.length){
    if(!(STATE.queue.items||[]).some(x=>x.status==='failed')) scheduleFastMonthRefresh();
    renderSyncStatus();
    return;
  }
  STATE.queue.flushing=true;
  batch.forEach(x=>{x.status='saving';x.attempts=(x.attempts||0)+1;});
  persistFastQueue(); renderSyncStatus();
  api('addTransactionsFast',batch.map(x=>({clientId:x.clientId,data:x.data}))).then(r=>{
    const byId={}; (r.results||[]).forEach(x=>{byId[x.clientId]=x;});
    batch.forEach(item=>{
      const result=byId[item.clientId];
      if(result&&result.ok){ item.status='saved'; item.error=''; }
      else{ item.status='failed'; item.error=(result&&result.error)||'저장 결과를 확인하지 못했어'; }
    });
    STATE.queue.items=STATE.queue.items.filter(x=>x.status!=='saved');
    persistFastQueue();
    STATE.queue.flushing=false;
    if(STATE.queue.items.some(x=>x.status==='pending')) scheduleQueueFlush(50);
    else{
      renderSyncStatus(STATE.queue.items.some(x=>x.status==='failed')?'':'✓ 모두 저장됨');
      scheduleFastMonthRefresh();
    }
  }).catch(e=>{
    batch.forEach(item=>{
      if(item.attempts<3){ item.status='pending'; item.error=(e&&e.message)||'연결 오류'; }
      else{ item.status='failed'; item.error=(e&&e.message)||'연결 오류'; }
    });
    STATE.queue.flushing=false; persistFastQueue(); renderSyncStatus();
    if(batch.some(x=>x.status==='pending')) scheduleQueueFlush(800*Math.max(1,batch[0].attempts));
  });
}
function scheduleFastMonthRefresh(){
  clearTimeout(STATE.queue.refreshTimer);
  STATE.queue.refreshTimer=setTimeout(refreshFastMonthData,650);
}
function refreshFastMonthData(){
  api('getFastMonthData',STATE.ym).then(r=>{
    if(r.ym!==STATE.ym) return;
    STATE.summary=r.summary||STATE.summary;
    STATE.budget=r.budget||STATE.budget;
    STATE.recent=r.recent||STATE.recent;
    STATE.insight=r.insight||STATE.insight;
    STATE.trend=null; STATE.trendError='';
    renderHome(); renderMore();
    if(!hasActiveListFilters()&&STATE.list.mode==='recent'){
      STATE.list.rows=STATE.recent; STATE.list.count=STATE.recent.length; renderList();
    }
  }).catch(()=>{});
}
function collectTransactionData(){
  const amount=Number(document.getElementById('fAmount').value.replace(/[^0-9]/g,''))||0;
  if(!STATE.form.type){ toast('구분을 골라줘',true); return null; }
  if(!STATE.form.cat){ toast('대분류를 골라줘',true); return null; }
  if(amount<=0){ toast('금액을 입력해줘',true); return null; }
  return {
    date:document.getElementById('fDate').value||todayStr(),
    type:STATE.form.type,cat:STATE.form.cat,amount:amount,
    desc:document.getElementById('fDesc').value.trim(),fixed:STATE.form.fixed,user:STATE.form.user,
    memo:document.getElementById('fMemo').value.trim(),spendingMood:normalizeMood(STATE.form.spendingMood)
  };
}
function submitTx(keepOpen){
  if(STATE.queue.enqueueLocked) return;
  const data=collectTransactionData();
  if(!data) return;
  const editing=STATE.editing;
  if(!editing){
    STATE.queue.enqueueLocked=true;
    setTimeout(()=>{STATE.queue.enqueueLocked=false;},250);
    enqueueFastTransaction(data,!!keepOpen);
    return;
  }

  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 저장 중…';
  api('updateTransaction',editing.row,data,STATE.ym).then(r=>{
    btn.disabled=false; btn.textContent='저장하기';
    applyTxResult(r); renderHome(); closeSheet(); refreshListAfterMutation();
    toast('수정 완료 ✅');
  }).catch(e=>{ btn.disabled=false; btn.textContent='저장하기'; toast(e.message||'저장하지 못했어',true); });
}

/* ============ 탭/이벤트 ============ */
function switchView(v){
  var moreChildren = ['ai','review','recurring'];
  var tabView = moreChildren.indexOf(v) > -1 ? 'more' : v;
  document.querySelectorAll('.tab[data-view]').forEach(t=>t.classList.toggle('active', t.dataset.view===tabView));
  ['home','list','recurring','asset','ai','review','more'].forEach(name=>
    document.getElementById('v-'+name).classList.toggle('on', name===v));
  if(v==='more') renderMore();
  if(v==='recurring') renderRecurring();
  if(v==='ai') renderAi();
  if(v==='review') renderReview();
  window.scrollTo(0,0);
}

function bindApp(){
  document.querySelectorAll('.tab[data-view]').forEach(t=>
    t.addEventListener('click', ()=>switchView(t.dataset.view)));
  document.getElementById('addBtn').addEventListener('click', openSheet);
  document.getElementById('desktopAddBtn').addEventListener('click', openSheet);
  document.getElementById('sheetX').addEventListener('click', closeSheet);
  document.getElementById('budgetX').addEventListener('click', closeBudgetSheet);
  document.getElementById('closeMonthX').addEventListener('click', closeCloseMonthSheet);
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  document.getElementById('closeCancelBtn').addEventListener('click', closeCloseMonthSheet);
  document.getElementById('overlay').addEventListener('click', closeAllSheets);
  document.getElementById('submitBtn').addEventListener('click', ()=>submitTx(false));
  document.getElementById('continueBtn').addEventListener('click', ()=>submitTx(true));
  document.getElementById('closeRunBtn').addEventListener('click', runCloseMonth);
  document.getElementById('fAmount').addEventListener('input', e=>formatCommaInput(e.target));
  document.getElementById('fAmount').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('fDesc').focus(); });
  document.getElementById('fDesc').addEventListener('keydown', e=>{ if(e.key==='Enter') submitTx(false); });
  document.getElementById('fDesc').addEventListener('input', ()=>{
    suggestMood();
    renderMoodChips();
    renderRecommendation();
  });
  document.getElementById('addBudgetBtn').addEventListener('click', addBudgetRow);
  document.getElementById('copyBudgetBtn').addEventListener('click', copyPreviousBudget);
  document.getElementById('recommendBudgetBtn').addEventListener('click', recommendBudgetUi);
  document.getElementById('budgetSaveBtn').addEventListener('click', saveBudget);

  document.getElementById('prevM').addEventListener('click', ()=>moveMonth(-1));
  document.getElementById('nextM').addEventListener('click', ()=>moveMonth(1));
}
function moveMonth(delta){
  STATE.ym = shiftYm(STATE.ym, delta);
  document.getElementById('mLabel').textContent=STATE.ym;
  // 로딩 표시
  document.getElementById('v-home').innerHTML='<div class="empty"><span class="spinner" style="border-color:#ccc;border-top-color:#2f5233"></span></div>';
  api('getMonthData', STATE.ym).then(r=>{
    STATE.summary=r.summary; STATE.recent=r.recent || [];
    STATE.budget=r.budget || STATE.budget;
    STATE.transactions=r.transactions || [];
    STATE.closeHistory=r.closeHistory || STATE.closeHistory || [];
    STATE.insight=r.insight || STATE.insight;
    STATE.monthlyReview=null;
    STATE.aiCurrent=(STATE.aiHistory||[]).find(h=>h.ym===STATE.ym)||null;
    renderHome(); renderMore(); renderRecurring(); renderAi(); renderReview();
    if(hasActiveListFilters()){
      loadTransactions(false);
    } else if(STATE.list.mode==='month'){
      STATE.list.rows=STATE.transactions;
      STATE.list.count=r.count || STATE.transactions.length;
      renderList();
    } else {
      STATE.list.rows=STATE.recent;
      STATE.list.count=STATE.recent.length;
      renderList();
    }
  }).catch(e=>toast(e.message||'불러오지 못했어', true));
}

/* ============ 시작 ============ */
document.addEventListener('DOMContentLoaded', ()=>{ 
  bindApp(); 
  openGate(); 
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  }
});
</script>
