<style>
:root{
  --ink:#1a2e20; --forest:#1e3a28; --green:#2f5233; --sage:#7a9b7a;
  --gold:#c08a2d; --gold-soft:#f3e6c6;
  --bg:#f4f3ee; --card:#ffffff; --line:#e7e5dc; --line-soft:#f0eee6;
  --income:#2d7d54; --expense:#cf5a48; --muted:#8c8a80;
  --shadow:0 1px 3px rgba(30,58,40,.06), 0 8px 24px rgba(30,58,40,.05);
  --r:18px; --r-sm:12px;
  --tabh:64px; --safe-b:env(safe-area-inset-bottom,0px);
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}

/* ===== PIN 게이트 ===== */
#gate{position:fixed;inset:0;background:var(--forest);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;padding:24px;text-align:center;color:#fff}
#gate .logo{font-size:40px;margin-bottom:6px}
#gate h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
#gate p{color:#a8c0a8;font-size:13px;margin-top:6px;margin-bottom:28px}
#pin{width:200px;text-align:center;font-size:26px;letter-spacing:14px;font-weight:700;
  padding:14px 0 14px 14px;border-radius:14px;border:1.5px solid #3c5a44;background:#16301f;color:#fff;
  font-variant-numeric:tabular-nums}
#pin:focus{outline:none;border-color:var(--gold)}
#pin.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#gateBtn{margin-top:18px;width:200px;padding:14px;border-radius:14px;background:var(--gold);color:#3a2a08;
  font-weight:800;font-size:16px;transition:transform .1s,opacity .2s}
#gateBtn:active{transform:scale(.97)}
#gateMsg{color:#e3a99b;font-size:13px;height:18px;margin-top:12px}

/* ===== 앱 레이아웃 ===== */
#app{display:none;min-height:100%;padding-bottom:calc(var(--tabh) + var(--safe-b) + 16px)}
#app.on{display:block}

header.top{position:sticky;top:0;z-index:30;background:var(--forest);color:#fff;
  padding:14px 18px calc(14px) 18px;border-radius:0 0 22px 22px}
.top-inner{max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand .name{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
.brand .name .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.brand .who{font-size:12px;color:#a8c0a8}
.monthnav{display:flex;align-items:center;justify-content:center;gap:18px}
.monthnav button{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);
  font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s}
.monthnav button:active{background:rgba(255,255,255,.25)}
.monthnav .mlabel{font-size:18px;font-weight:800;letter-spacing:-.01em;min-width:118px;text-align:center;
  font-variant-numeric:tabular-nums}
.desktop-nav{display:none}

main{padding:16px 16px 0}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 카드 공통 ===== */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.sec-title{font-size:14px;font-weight:800;color:var(--muted);margin:28px 4px 14px;letter-spacing:.01em}
.sec-title:first-child{margin-top:8px}

/* 잔고 메인 카드 */
.balance{background:linear-gradient(150deg,#26432f,#1c3525);color:#fff;border-radius:22px;padding:22px;
  box-shadow:0 10px 30px rgba(28,53,37,.22);position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;
  background:radial-gradient(circle,rgba(192,138,45,.22),transparent 70%);border-radius:50%}
.balance .lab{font-size:13px;color:#b6cdb6;display:flex;align-items:center;gap:8px}
.balance .big{font-size:40px;font-weight:800;letter-spacing:-.02em;margin-top:8px;line-height:1.1}
.balance .big.minus{color:#f0a99c}
.balance .rate{display:inline-flex;align-items:center;gap:5px;margin-top:14px;background:rgba(192,138,45,.18);
  color:var(--gold-soft);font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}

/* mini 3분할 */
.mini3{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.mini{background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:13px 12px;text-align:center}
.mini .l{font-size:11px;color:var(--muted);font-weight:600}
.mini .v{font-size:18px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
.mini .v.in{color:var(--income)} .mini .v.out{color:var(--expense)} .mini .v.sv{color:var(--gold)}

/* 분류별 바 */
.bars{display:flex;flex-direction:column;gap:14px}
.bar .head{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px}
.bar .head .nm{display:flex;align-items:center;gap:8px;font-weight:600}
.bar .head .nm .e{font-size:16px}
.bar .head .amt{font-weight:700;font-variant-numeric:tabular-nums}
.bar .head .amt small{color:var(--muted);font-weight:600;margin-left:5px}
.bar .track{height:8px;background:var(--line-soft);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--sage))}
.bar:first-child .fill{background:linear-gradient(90deg,#1e3a28,var(--green))}

/* 거래 리스트 */
.tx{display:flex;align-items:center;gap:13px;padding:13px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.tx:last-child{border-bottom:none}
.date-group-header{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 8px;margin-top:8px;border-bottom:1.5px solid var(--line-soft)}
.date-group-header:first-child{margin-top:0}
.date-group-header .date-title{font-size:13px;font-weight:900;color:var(--ink)}
.date-group-header .date-total{font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.tx .ico{width:40px;height:40px;border-radius:12px;background:var(--line-soft);display:flex;
  align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .mid .d{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid .s{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tx .mid .s .tag{background:var(--line-soft);padding:1px 6px;border-radius:6px}
.tx .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.tx .amt.in{color:var(--income)} .tx .amt.out{color:var(--expense)} .tx .amt.sv{color:var(--gold)}
.tx .del{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:16px;display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.tx .del:active{background:#fbe9e6;color:var(--expense)}
.confirm{display:flex;gap:6px;flex-shrink:0}
.confirm button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px}
.confirm .yes{background:var(--expense);color:#fff}
.confirm .no{background:var(--line-soft);color:var(--ink)}
.tx-table-wrap{display:none}

/* 내역 필터 */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 10px}
.list-head .sec-title{margin:0}
.list-count{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
.filter-card{margin-bottom:12px;padding:14px}
.filter-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:900;color:var(--green)}
.filter-toggle .chev{transition:transform .18s}
.filter-card.closed .filter-toggle .chev{transform:rotate(180deg)}
.filter-card.closed .filter-body{display:none}
.filter-body{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-btn{min-height:40px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:900;color:var(--muted)}
.mode-btn.on{background:var(--green);border-color:var(--green);color:#fff}
.filter-grid{display:grid;grid-template-columns:1fr;gap:9px}
.filter-field label{display:block;font-size:11.5px;color:var(--muted);font-weight:800;margin-bottom:5px}
.filter-field input,.filter-field select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:0 11px}
.filter-field input:focus,.filter-field select:focus{outline:none;border-color:var(--green)}
.filter-actions{display:flex;gap:8px}
.filter-actions button{flex:1;height:42px;border-radius:11px;font-weight:900}
.filter-actions .search{background:var(--green);color:#fff}
.filter-actions .reset{background:var(--line-soft);color:var(--ink)}

/* 정기거래 */
.recurring-layout{display:grid;grid-template-columns:1fr;gap:14px}
.recurring-status{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.recurring-status .state{font-size:18px;font-weight:900;color:var(--green)}
.recurring-status .hint{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.recurring-actions{display:flex;gap:8px;flex-wrap:wrap}
.recurring-actions button{height:42px;border-radius:11px;font-weight:900;padding:0 13px;background:var(--line-soft)}
.recurring-actions .run{background:var(--gold);color:#3a2a08}
.recurring-actions .auto{background:var(--green);color:#fff}
.recurring-actions .auto.off{background:var(--expense)}
.recurring-form{display:grid;grid-template-columns:1fr;gap:9px}
.recurring-form .full{grid-column:1/-1}
.recurring-form .checkline{display:flex;align-items:center;gap:8px;height:42px;font-weight:900;color:var(--green)}
.recurring-form input[type="checkbox"]{width:18px;height:18px;accent-color:var(--green)}
.recurring-list{display:flex;flex-direction:column;gap:10px}
.recurring-item{border:1px solid var(--line-soft);border-radius:14px;background:#fcfbf7;padding:13px}
.recurring-item.off{opacity:.55}
.recurring-item .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.recurring-item .name{font-weight:900;font-size:15px}
.recurring-item .meta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.recurring-item .amt{font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.recurring-item .tools{display:flex;gap:7px;margin-top:11px}
.recurring-item .tools button{height:34px;border-radius:9px;padding:0 10px;font-size:12px;font-weight:900;background:#fff;border:1px solid var(--line)}
.recurring-item .tools .danger{background:#fbe9e6;border-color:#f3cbc5;color:var(--expense)}
.recurring-empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:13.5px}

/* 추이 그래프 */
.trend-grid{display:grid;grid-template-columns:1fr;gap:12px}
.trend-card{padding:16px}
.trend-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.trend-title .t{font-size:13px;font-weight:900;color:var(--green)}
.trend-title .v{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
.trend-note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.trend-chart{width:100%;height:auto;display:block;overflow:visible}
.trend-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.trend-legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--muted)}
.trend-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.trend-empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:13.5px}
.asset-diff{font-size:13px;font-weight:900;margin-top:10px;color:var(--green)}
.asset-diff.down{color:var(--expense)}

/* 예산/고정비 카드 */
.budget-card .budget-top{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.budget-metric{background:#fcfbf7;border:1px solid var(--line-soft);border-radius:12px;padding:12px}
.budget-metric .l{font-size:11px;color:var(--muted);font-weight:800}
.budget-metric .v{font-size:17px;font-weight:900;margin-top:4px}
.budget-metric .v.bad{color:var(--expense)}
.budget-daily{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);
  color:#6e5212;border-radius:13px;padding:12px 13px;font-weight:900;margin-bottom:12px}
.budget-daily small{display:block;font-size:11px;font-weight:700;color:#8a6b1d;margin-top:2px}
.budget-over{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.budget-over .item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;background:#fbe9e6;
  color:#9b3d2f;border-radius:10px;padding:8px 10px;font-weight:800}
.budget-actions{display:flex;justify-content:flex-end}
.small-btn{padding:9px 12px;border-radius:10px;background:var(--line-soft);font-size:12px;font-weight:900;color:var(--ink)}
.small-btn.primary{background:var(--green);color:#fff}
.mix-bars{display:flex;flex-direction:column;gap:10px}
.mix-row .head{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:5px}
.mix-row .track{height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.mix-row .fill{height:100%;background:var(--green)}
.mix-row.variable .fill{background:var(--gold)}
.top-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.top-mini span{background:var(--line-soft);border-radius:999px;padding:5px 8px;font-size:12px;font-weight:800}

/* 템플릿/추천 */
.template-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.template-strip::-webkit-scrollbar{display:none}
.template-chip{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-size:13px;font-weight:900;color:var(--ink)}
.template-chip:active{transform:scale(.97)}
.recommend-box{display:none;margin-top:8px}
.recommend-box.on{display:block}
.recommend-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:var(--gold-soft);
  color:#705312;font-size:12px;font-weight:900}
.mood-hint{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.45}
.meaning-summary{display:flex;flex-direction:column;gap:10px}
.meaning-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.meaning-item{border:1px solid var(--line-soft);border-radius:12px;background:#fcfbf7;padding:10px}
.meaning-item .l{font-size:12px;color:var(--muted);font-weight:800}
.meaning-item .v{font-size:15px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.meaning-note{font-size:12.5px;color:var(--muted);line-height:1.5}

/* 예산 편집 */
.budget-list{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.budget-row{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;align-items:center}
.budget-row .memo{grid-column:1/3}
.budget-row input,.budget-row select{height:40px;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:0 10px}
.budget-row .rm{width:34px;height:34px;border-radius:9px;background:#fbe9e6;color:var(--expense);font-weight:900}
.budget-tools{display:flex;gap:8px;margin-bottom:12px}
.budget-tools button{flex:1;height:40px;border-radius:10px;background:var(--line-soft);font-size:12px;font-weight:900}
.budget-tools .copy{background:var(--gold-soft);color:#705312}
.budget-tools .recommend{background:#e8f3ec;color:var(--green)}
.budget-ref{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px}
.budget-ref span{background:#fcfbf7;border:1px solid var(--line-soft);border-radius:999px;padding:4px 7px;font-size:11px;font-weight:800;color:var(--muted)}
.budget-reco{display:none;margin-bottom:12px;border:1px solid var(--line-soft);border-radius:14px;background:#fcfbf7;padding:12px}
.budget-reco.on{display:block}
.budget-reco-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.budget-reco-head .t{font-size:13px;font-weight:900;color:var(--green)}
.budget-reco-head .s{font-size:11.5px;color:var(--muted);font-weight:800;margin-top:2px}
.budget-reco-list{display:flex;flex-direction:column;gap:8px}
.budget-reco-row{display:grid;grid-template-columns:1fr 118px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:10px}
.budget-reco-row .name{font-size:13px;font-weight:900}
.budget-reco-row .refs{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.45;margin-top:3px}
.budget-reco-row input{height:38px;border:1.5px solid var(--line);border-radius:10px;text-align:right;padding:0 9px;font-weight:900}
.budget-reco-apply{width:100%;height:42px;border-radius:11px;background:var(--green);color:#fff;font-weight:900;margin-top:10px}

/* 자산 스냅샷 */
.snapshot-tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}
.snapshot-tools input{height:42px;border:1.5px solid var(--line);border-radius:11px;background:#fff;padding:0 11px}
.snapshot-tools button{height:42px;border-radius:11px;background:var(--gold);color:#3a2a08;font-weight:900;padding:0 13px}
.snapshot-list{display:flex;flex-direction:column;gap:9px}
.snapshot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.snapshot-row:last-child{border-bottom:none}
.snapshot-row .meta{min-width:0}
.snapshot-row .ym{font-weight:900}
.snapshot-row .when{font-size:12px;color:var(--muted)}
.snapshot-row .amt{text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.snapshot-row .diff{display:block;font-size:12px;color:var(--muted);font-weight:800}
.snapshot-row .diff.up{color:var(--income)}
.snapshot-row .diff.down{color:var(--expense)}

/* 확인 필요/백업 */
.anomaly-list{display:flex;flex-direction:column;gap:8px}
.anomaly-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;
  border-radius:12px;background:#fff7e8;border:1px solid #efd8a4;padding:10px 11px}
.anomaly-item .main{min-width:0}
.anomaly-item .msg{font-size:13px;font-weight:900;color:#71500f;line-height:1.35}
.anomaly-item .sub{font-size:12px;color:#9a7b34;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anomaly-item .amt{font-size:13px;font-weight:900;color:var(--expense);white-space:nowrap}
.backup-card{margin-top:12px}
.backup-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.backup-actions button{height:42px;border-radius:11px;background:var(--green);color:#fff;font-weight:900;padding:0 14px}
.backup-result{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.5;word-break:break-word}
.backup-result a{color:var(--green);font-weight:900}

/* 월 마감 */
.close-month-card{display:flex;flex-direction:column;gap:14px}
.close-month-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.close-month-head .ym{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.close-month-head .hint{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.45}
.close-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--gold-soft);color:#705312;
  padding:5px 9px;font-size:11.5px;font-weight:900;white-space:nowrap}
.close-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.close-actions button{height:42px;border-radius:11px;background:var(--green);color:#fff;font-weight:900;padding:0 14px}
.close-history{display:flex;flex-direction:column;gap:8px}
.close-history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line-soft);padding-top:9px}
.close-history-row:first-child{border-top:none;padding-top:0}
.close-history-row .meta{min-width:0}
.close-history-row .ym{font-weight:900}
.close-history-row .when{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close-history-row .amt{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.close-preview{display:flex;flex-direction:column;gap:12px}
.close-preview-note{font-size:13px;color:var(--muted);font-weight:700;line-height:1.5}
.close-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.close-metric{border:1px solid var(--line-soft);background:#fcfbf7;border-radius:12px;padding:10px}
.close-metric .l{font-size:11px;color:var(--muted);font-weight:800}
.close-metric .v{font-size:15px;font-weight:900;margin-top:3px;word-break:break-word}
.close-checks{display:grid;grid-template-columns:1fr;gap:8px}
.close-check{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line-soft);background:#fff;border-radius:12px;padding:10px 11px;
  font-weight:900}
.close-check input{width:18px;height:18px;margin-top:1px;accent-color:var(--green);flex:0 0 auto}
.close-check small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;margin-top:2px;line-height:1.35}
.close-result{display:none;border-radius:13px;padding:12px 13px;font-size:13px;font-weight:800;line-height:1.55;background:#e8f3ec;color:#245238}
.close-result.on{display:block}
.close-result.warn{background:#fff7e8;color:#71500f}
.close-anomalies{display:flex;flex-direction:column;gap:7px}
.close-anomaly{border-radius:10px;background:#fff7e8;border:1px solid #efd8a4;padding:8px 10px;font-size:12.5px;color:#71500f;font-weight:800}

/* 홈 인사이트 */
.home-status{background:#fff;border:1px solid var(--line-soft);border-left:5px solid var(--green);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px 16px;font-size:15px;font-weight:900;line-height:1.45;margin-bottom:14px}
.home-status.danger{border-left-color:var(--expense);background:#fff8f6;color:#853629}
.home-status.warning{border-left-color:var(--gold);background:#fffaf0;color:#73530e}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{width:100%;display:flex;align-items:flex-start;gap:10px;text-align:left;border:1px solid var(--line-soft);
  border-radius:12px;background:#fcfbf7;padding:10px 11px}
.task-item:active{transform:scale(.99)}
.task-dot{width:9px;height:9px;border-radius:50%;background:var(--sage);margin-top:6px;flex:0 0 auto}
.task-item.warning .task-dot{background:var(--gold)}
.task-item.danger .task-dot{background:var(--expense)}
.task-main{min-width:0;flex:1}
.task-title{font-size:13.5px;font-weight:900;line-height:1.35}
.task-desc{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4;margin-top:2px}
.forecast-card .forecast-main{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.forecast-card .forecast-main .l{font-size:12px;color:var(--muted);font-weight:800}
.forecast-card .forecast-main .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:3px}
.forecast-card .forecast-main .v.bad{color:var(--expense)}
.forecast-card .confidence{font-size:11px;color:#6e5212;background:var(--gold-soft);border-radius:999px;padding:4px 8px;font-weight:900;white-space:nowrap}
.forecast-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.forecast-metric{background:#fcfbf7;border:1px solid var(--line-soft);border-radius:12px;padding:10px}
.forecast-metric .l{font-size:11px;color:var(--muted);font-weight:800}
.forecast-metric .v{font-size:14px;font-weight:900;margin-top:3px;font-variant-numeric:tabular-nums}
.review-layout{display:grid;grid-template-columns:1fr;gap:14px}
.review-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.review-metric{background:#fcfbf7;border:1px solid var(--line-soft);border-radius:12px;padding:10px}
.review-metric .l{font-size:11px;color:var(--muted);font-weight:800}
.review-metric .v{font-size:15px;font-weight:900;margin-top:3px}
.review-topcats{display:flex;flex-direction:column;gap:8px}
.review-check-list{display:flex;flex-direction:column;gap:8px}
.review-check{border:1px solid var(--line-soft);background:#fffaf0;border-radius:12px;padding:10px;font-size:13px}
.review-check .t{font-weight:900;color:#71500f}
.review-check .d{color:#8c6a1a;font-weight:700;font-size:12px;margin-top:3px}
.review-form{display:grid;grid-template-columns:1fr;gap:11px}
.review-field label{display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:6px}
.review-field textarea,.review-field input{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font-family:inherit;font-size:15px}
.review-field textarea{min-height:92px;resize:vertical;line-height:1.5}
.review-field textarea:focus,.review-field input:focus{outline:none;border-color:var(--green)}
.review-save{width:100%;height:48px;border-radius:13px;background:var(--green);color:#fff;font-size:15px;font-weight:900}
.review-history{display:grid;grid-template-columns:1fr;gap:10px}
.review-history-card{border:1px solid var(--line-soft);border-radius:14px;background:#fff;padding:12px}
.review-history-card .top{display:flex;justify-content:space-between;gap:10px;font-weight:900}
.review-history-card .body{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.5;margin-top:8px}
.review-note{background:var(--gold-soft);color:#6e5212;border-radius:14px;padding:13px;font-size:13px;font-weight:800;line-height:1.55}

/* 자산 */
.total-asset{text-align:center;padding:6px 0 2px}
.total-asset .l{font-size:13px;color:var(--muted);font-weight:600}
.total-asset .v{font-size:30px;font-weight:800;color:var(--green);letter-spacing:-.02em;margin-top:4px}
.assetrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line-soft)}
.assetrow:last-child{border-bottom:none}
.assetrow .ico{width:38px;height:38px;border-radius:11px;background:var(--line-soft);display:flex;
  align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.assetrow .nm{flex:1;font-weight:600;font-size:14.5px}
.assetrow .nm small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.assetrow input{width:128px;text-align:right;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;
  font-weight:700;font-variant-numeric:tabular-nums;background:#fcfbf7}
.assetrow input:focus{outline:none;border-color:var(--gold);background:#fff}
.assetrow.debt input{color:var(--expense)}
.save-btn{width:100%;margin-top:16px;padding:15px;border-radius:14px;background:var(--green);color:#fff;
  font-weight:800;font-size:16px;transition:transform .1s,opacity .2s}
.save-btn:active{transform:scale(.98)} .save-btn:disabled{opacity:.55}

/* AI */
.ai-pick{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ai-pick .m{flex:1;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.ai-run{padding:12px 18px;border-radius:13px;background:var(--gold);color:#3a2a08;font-weight:800;
  display:flex;align-items:center;gap:7px;transition:transform .1s,opacity .2s}
.ai-run:active{transform:scale(.97)} .ai-run:disabled{opacity:.5}
.ai-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:12px}
.ai-card .meta{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px;display:flex;
  align-items:center;gap:8px}
.ai-card .meta .ym{background:var(--gold-soft);color:#7a5a12;padding:2px 8px;border-radius:7px;font-weight:700}
.ai-card .body{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.ai-note{background:var(--gold-soft);color:#6e5212;border-radius:var(--r);padding:16px;font-size:13.5px;line-height:1.6}
.ai-note code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-size:12px}

/* 빈 상태 */
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.empty .e{font-size:34px;display:block;margin-bottom:10px;opacity:.6}

/* ===== 하단 탭바 ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + var(--safe-b));
  padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:flex-start;justify-content:space-around;z-index:40}
.tabbar .tab{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;transition:color .15s}
.tabbar .tab .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.5;transition:.15s}
.tabbar .tab.active{color:var(--green)}
.tabbar .tab.active .ic{filter:none;opacity:1}
.tabbar .add{flex:0 0 auto;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;
  font-size:30px;font-weight:300;display:flex;align-items:center;justify-content:center;margin-top:-18px;
  box-shadow:0 6px 18px rgba(47,82,51,.4);transition:transform .12s}
.tabbar .add:active{transform:scale(.92)}

/* ===== 입력 bottom sheet ===== */
.overlay{position:fixed;inset:0;background:rgba(20,35,25,.4);opacity:0;visibility:hidden;
  transition:opacity .25s;z-index:50}
.overlay.on{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);z-index:60;
  border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet .grip{width:40px;height:4px;border-radius:3px;background:#d8d6cc;margin:10px auto 4px}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px}
.sheet .shead h2{font-size:18px;font-weight:800}
.sheet .shead .x{font-size:22px;color:var(--muted);width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.sheet .sbody{overflow-y:auto;padding:0 20px 16px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:11px;background:#fff;border:1.5px solid var(--line);
  font-size:14px;font-weight:600;color:var(--ink);transition:.12s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.sub.on{background:var(--gold);border-color:var(--gold);color:#3a2a08}
.in-text{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.in-text:focus{outline:none;border-color:var(--green)}
.amount-wrap{position:relative}
.amount-wrap .won{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-weight:800;
  font-size:22px;color:var(--sage);pointer-events:none}
#fAmount{width:100%;padding:15px 14px 15px 38px;border:1.5px solid var(--line);border-radius:13px;background:#fff;
  font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
#fAmount:focus{outline:none;border-color:var(--green)}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.sheet-actions{display:grid;grid-template-columns:.42fr .58fr;gap:10px;margin-top:4px}
.tx-sheet-actions{grid-template-columns:.28fr .36fr .36fr}
.tx-sheet-actions.editing{grid-template-columns:.42fr .58fr}
.cancel-btn,.continue-btn{width:100%;padding:16px;border-radius:15px;background:#fff;border:1.5px solid var(--line);color:var(--muted);font-weight:900;
  font-size:17px;transition:transform .1s,opacity .2s}
.continue-btn{background:var(--gold-soft);border-color:#ead59f;color:#705312}
.cancel-btn:active,.continue-btn:active{transform:scale(.98)}
.submit{width:100%;padding:16px;border-radius:15px;background:var(--green);color:#fff;font-weight:800;
  font-size:17px;margin-top:4px;transition:transform .1s,opacity .2s}
.sheet-actions .submit{margin-top:0}
.submit:active{transform:scale(.98)} .submit:disabled,.continue-btn:disabled{opacity:.5}

/* 저장 동기화 상태 */
#syncStatus{position:fixed;left:50%;bottom:calc(var(--tabh) + var(--safe-b) + 18px);transform:translateX(-50%) translateY(18px);
  z-index:79;opacity:0;visibility:hidden;transition:.22s;background:#fff;color:var(--green);border:1px solid var(--line);
  box-shadow:0 8px 24px rgba(20,35,25,.14);padding:10px 13px;border-radius:13px;font-size:12.5px;font-weight:900;
  display:flex;align-items:center;gap:8px;max-width:92vw;white-space:nowrap}
#syncStatus.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
#syncStatus.err{color:var(--expense);border-color:#f3cbc5;background:#fff8f6}
#syncStatus button{padding:5px 8px;border-radius:8px;background:var(--line-soft);font-size:11px;font-weight:900}
#syncStatus.err button{background:#fbe9e6;color:var(--expense)}
/* tabbar: reduced to 5 tabs, normal sizing */

/* 토스트 */
#toast{position:fixed;bottom:calc(var(--tabh) + var(--safe-b) + 18px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:14px;font-size:14px;font-weight:600;
  opacity:0;visibility:hidden;transition:.25s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:88vw;text-align:center}
#toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--expense)}

.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
.spinner.dark{border-color:rgba(58,42,8,.3);border-top-color:#3a2a08}
@keyframes spin{to{transform:rotate(360deg)}}

.desktop-only{display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(192,138,45,.34);outline-offset:2px}

.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.more-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:28px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  font-size:14px;font-weight:800;color:var(--ink);transition:transform .12s;width:100%;border:none;cursor:pointer}
.more-item:active{transform:scale(.97)}
.more-item .more-icon{font-size:28px}
.more-back{display:inline-flex;align-items:center;gap:6px;padding:8px 0;font-size:13px;
  font-weight:800;color:var(--green);margin-bottom:4px;background:none;border:none;cursor:pointer}
.more-back:active{opacity:.7}

@media (hover:hover){
  .monthnav button:hover{background:rgba(255,255,255,.22)}
  .tabbar .tab:hover,.desktop-nav .tab:hover{color:var(--green)}
  .desktop-nav .tab:hover{background:rgba(255,255,255,.95)}
  .tabbar .add:hover,.desktop-add:hover,.save-btn:hover,.submit:hover{filter:brightness(1.05)}
  .chip:hover{border-color:var(--sage)}
  .tx .del:hover{background:#fbe9e6;color:var(--expense)}
  .ai-run:hover{filter:brightness(1.04)}
  .mode-btn:hover,.filter-actions button:hover,.cancel-btn:hover,.small-btn:hover,.template-chip:hover,.snapshot-tools button:hover{filter:brightness(.98)}
}

@media (min-width:768px){
  :root{--tabh:0px}
  body{font-size:14px}
  #app{padding-bottom:40px}
  header.top{padding:16px 28px;border-radius:0 0 26px 26px}
  .top-inner{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px 22px}
  .brand{margin-bottom:0;justify-content:flex-start;gap:14px}
  .brand .name{font-size:16px}
  .brand .who{font-size:12px}
  .monthnav{justify-self:end;gap:12px}
  .monthnav button{width:32px;height:32px}
  .monthnav .mlabel{font-size:17px;min-width:112px}
  .desktop-nav{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:8px}
  .desktop-nav .tab{min-height:40px;padding:0 14px;border-radius:999px;color:#dce8dc;font-weight:800;font-size:13px;
    display:flex;align-items:center;gap:7px;transition:background .15s,color .15s,transform .12s}
  .desktop-nav .tab .ic{font-size:16px;line-height:1}
  .desktop-nav .tab.active{background:#fff;color:var(--green)}
  .desktop-add{min-height:40px;padding:0 16px;border-radius:999px;background:var(--gold);color:#3a2a08;
    font-size:13px;font-weight:900;box-shadow:0 8px 18px rgba(0,0,0,.12);transition:filter .15s,transform .12s}

  main{width:100%;max-width:1120px;margin:0 auto;padding:24px 28px 0}
  .card{padding:20px}
  .sec-title{margin:0 4px 10px;font-size:12px;text-transform:none}
  .desktop-only{display:block}

  .home-dashboard{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:18px;align-items:stretch}
  .home-balance-col,.home-mini-col,.home-panel{min-width:0}
  .home-balance-col{display:flex}
  .home-balance-col .balance{flex:1;min-height:190px;display:flex;flex-direction:column;justify-content:center}
  .balance{padding:26px}
  .balance .big{font-size:48px}
  #v-home{max-width:640px;margin-left:auto;margin-right:auto}
  .home-mini-col .mini3{height:100%;margin-top:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .home-mini-col .mini{min-height:88px;padding:16px 14px;display:flex;flex-direction:column;justify-content:center}
  .mini .l{font-size:12px}
  .mini .v{font-size:17px}
  .home-panel .card{height:100%}
  .home-cats,.home-recent{display:flex;flex-direction:column;gap:0}
  .bar .head{font-size:13px}

  .tabbar{display:none}
  #toast{bottom:28px}
  #syncStatus{bottom:28px}

  .mobile-list-card{display:none}
  .tx-table-wrap{display:block;overflow:hidden;padding:0}
  .tx-table{width:100%;border-collapse:collapse;table-layout:fixed;background:#fff}
  .tx-table th,.tx-table td{padding:13px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;text-align:left}
  .tx-table th{font-size:12px;color:var(--muted);font-weight:800;background:#fbfaf6}
  .tx-table td{font-size:13.5px}
  .tx-table tr[data-row]{cursor:pointer}
  .tx-table tbody tr:hover{background:#fcfbf7}
  .tx-table tr:last-child td{border-bottom:none}
  .tx-table .date-cell{width:104px;font-variant-numeric:tabular-nums;color:var(--muted)}
  .tx-table .user-cell{width:78px;color:var(--muted)}
  .tx-table .type-cell{width:92px}
  .tx-table .cat-cell{width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx-table .mood-cell{width:92px;color:var(--muted)}
  .tx-table .desc-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============ 서버 호출 래퍼 ============ */
function srv(fn){ return function(){
  const args = Array.prototype.slice.call(arguments);
  return new Promise((res,rej)=>{
    const runner = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    runner[fn].apply(runner,args);
  });
}; }
function api(fn){
  const args = Array.prototype.slice.call(arguments,1);
  args.unshift(STATE.pin);
  return srv(fn).apply(null,args);
}

/* ============ 표시 유틸 ============ */
function fmt(n){ n=Math.round(n||0); const neg=n<0; return (neg?'-':'')+'₩'+Math.abs(n).toLocaleString('en-US'); }
function comma(n){ return Math.round(Math.abs(n||0)).toLocaleString('en-US'); }
function pad(x){ return String(x).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function shiftYm(ym,delta){ const p=ym.split('-'); const d=new Date(+p[0], +p[1]-1+delta, 1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function jsStr(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function monthLabel(ym){ const m=String(ym||'').slice(5,7); return m? Number(m)+'월' : ''; }
function shortWon(n){
  n=Math.round(Number(n)||0);
  const neg=n<0; const abs=Math.abs(n);
  let s;
  if(abs>=100000000) s=(Math.round(abs/10000000)/10)+'억';
  else if(abs>=10000) s=Math.round(abs/10000)+'만';
  else s=abs.toLocaleString('en-US');
  return (neg?'-':'')+'₩'+s;
}

let toastT;
function toast(msg, err){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='on'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className=t.className.replace('on',''), err?2800:1800);
}

function loadTrendData(force){
  if(STATE.trendLoading) return;
  if(STATE.trend && !force) return;
  STATE.trendLoading=true; STATE.trendError='';
  api('getTrendData', 6).then(r=>{
    STATE.trend=r||{months:[],assetSnapshots:[]};
    STATE.trendLoading=false;
    renderHome(); renderMore(); renderAi(); renderAsset();
  }).catch(e=>{
    STATE.trendLoading=false;
    STATE.trendError=(e&&e.message)||'추이 데이터를 불러오지 못했어';
    renderHome(); renderMore(); renderAi(); renderAsset();
  });
}
function ensureTrendData(){
  if(!STATE.trend && !STATE.trendLoading && !STATE.trendError) loadTrendData(false);
}
function trendShell(){
  ensureTrendData();
  if(STATE.trendError) return `<div class="card trend-card"><div class="trend-empty">${esc(STATE.trendError)}</div></div>`;
  if(STATE.trendLoading || !STATE.trend) return `<div class="card trend-card"><div class="trend-empty"><span class="spinner" style="border-color:#ccc;border-top-color:#2f5233"></span></div></div>`;
  return '';
}
function hasTrendValues(rows, keys){
  return (rows||[]).some(r=>keys.some(k=>Number(r[k])!==0));
}
function trendLineChart(rows, series, opts){
  rows = rows || [];
  opts = opts || {};
  const w=320, h=156, left=38, right=14, top=16, bottom=32;
  const plotW=w-left-right, plotH=h-top-bottom;
  if(!rows.length) return '';
  let vals=[];
  rows.forEach(r=>series.forEach(s=>vals.push(Number(s.value ? s.value(r) : r[s.key])||0)));
  let min=Math.min(0, ...vals), max=Math.max(0, ...vals);
  if(min===max){ max=max+1; min=Math.min(0,min); }
  const xFor=i=> rows.length===1 ? left+plotW/2 : left+(plotW*i/(rows.length-1));
  const yFor=v=> top+((max-v)/(max-min))*plotH;
  const grid=[max,(max+min)/2,min].map(v=>`<line x1="${left}" y1="${yFor(v).toFixed(1)}" x2="${w-right}" y2="${yFor(v).toFixed(1)}" stroke="#f0eee6" stroke-width="1"/>`).join('');
  const yLabs=[max,min].map(v=>`<text x="4" y="${yFor(v).toFixed(1)}" font-size="10" fill="#8c8a80">${esc(shortWon(v))}</text>`).join('');
  const xLabs=rows.map((r,i)=>`<text x="${xFor(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="#8c8a80">${esc(monthLabel(r.ym))}</text>`).join('');
  const paths=series.map(s=>{
    const pts=rows.map((r,i)=>[xFor(i),yFor(Number(s.value ? s.value(r) : r[s.key])||0)]);
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${s.color}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }).join('');
  return `<svg class="trend-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(opts.label||'추이 그래프')}">${grid}${yLabs}${paths}${xLabs}</svg>`;
}
function trendLegend(series){
  return `<div class="trend-legend">${series.map(s=>`<span><i class="trend-dot" style="background:${s.color}"></i>${esc(s.label)}</span>`).join('')}</div>`;
}
function trendCard(title, rows, series, note, valueLabel){
  const empty = !rows || rows.length < 2 || !(rows||[]).some(r=>series.some(s=>Number(s.value ? s.value(r) : r[s.key])!==0));
  return `<div class="card trend-card">
    <div class="trend-title"><div class="t">${esc(title)}</div>${valueLabel?`<div class="v">${esc(valueLabel)}</div>`:''}</div>
    ${empty?`<div class="trend-empty">아직 추이를 보여줄 데이터가 부족해요</div>`:trendLineChart(rows, series, {label:title})}
    ${empty?'':trendLegend(series)}
    ${note&&!empty?`<div class="trend-note">${esc(note)}</div>`:''}
  </div>`;
}
function maxMonthNote(rows, key, label){
  rows=rows||[];
  const max=rows.reduce((best,r)=>Number(r[key]||0)>Number(best[key]||0)?r:best, rows[0]||{});
  if(!max || !(Number(max[key])>0)) return '';
  return `최근 6개월 중 ${monthLabel(max.ym)} ${label}이 가장 높아요.`;
}
function changeNote(rows, key, label){
  rows=rows||[];
  if(rows.length<2) return '';
  const cur=Number(rows[rows.length-1][key]||0), prev=Number(rows[rows.length-2][key]||0);
  if(!prev && !cur) return '';
  const diff=cur-prev;
  if(diff===0) return `${label}가 지난달과 같아요.`;
  if(prev>0){
    const pct=Math.round(Math.abs(diff)/prev*100);
    return `${label}가 지난달보다 ${pct}% ${diff>0?'늘었어요':'줄었어요'}.`;
  }
  return `${label}가 지난달보다 ${shortWon(Math.abs(diff))} ${diff>0?'늘었어요':'줄었어요'}.`;
}
function dominantCatTrend(rows){
  const sums={};
  (rows||[]).forEach(r=>(r.topCats||[]).forEach(c=>{ sums[c.cat]=(sums[c.cat]||0)+Number(c.amt||0); }));
  const cat=Object.keys(sums).sort((a,b)=>sums[b]-sums[a])[0];
  if(!cat) return null;
  const data=(rows||[]).map(r=>{
    const found=(r.topCats||[]).find(c=>c.cat===cat);
    return {ym:r.ym, amt:found?Number(found.amt)||0:0};
  });
  return {cat:cat, data:data};
}

function openGate(){
  const btn=document.getElementById('gateBtn'), pinEl=document.getElementById('pin'), msg=document.getElementById('gateMsg');
  function tryOpen(){
    const pin=pinEl.value.trim();
    if(!pin){ pinEl.classList.add('shake'); setTimeout(()=>pinEl.classList.remove('shake'),400); return; }
    btn.disabled=true; btn.innerHTML='<span class="spinner dark"></span>'; msg.textContent='';
    STATE.pin=pin;
    api('getBoot').then(data=>{
      Object.assign(STATE, data);
      const savedUser=localStorage.getItem(PREFERRED_USER_KEY)||'';
      STATE.form.user=(savedUser==='지수'||savedUser==='하콩')?savedUser:'';
      STATE.aiCurrent=(STATE.aiHistory||[]).find(h=>h.ym===STATE.ym)||null;
      STATE.transactions = data.transactions || data.recent || [];
      STATE.list.rows = STATE.transactions;
      STATE.list.count = STATE.transactions.length;
      STATE.templates = data.templates || [];
      STATE.recurrings = data.recurrings || [];
      STATE.recurringStatus = data.recurringStatus || {installed:false};
      STATE.assetSnapshots = data.assetSnapshots || [];
      STATE.closeHistory = data.closeHistory || [];
      STATE.insight = data.insight || STATE.insight;
      document.getElementById('gate').style.display='none';
      document.getElementById('app').classList.add('on');
      restoreFastQueue();
      renderAll();
      scheduleQueueFlush(120);
    }).catch(e=>{
      btn.disabled=false; btn.textContent='열기';
      msg.textContent = (e&&e.message) ? e.message : '연결 오류, 다시 시도해줘';
      pinEl.value=''; pinEl.classList.add('shake'); setTimeout(()=>pinEl.classList.remove('shake'),400);
    });
  }
  btn.addEventListener('click', tryOpen);
  pinEl.addEventListener('keydown', e=>{ if(e.key==='Enter') tryOpen(); });
  pinEl.focus();
}

/* ============ 예산 편집 ============ */
function budgetBaseItems(){
  if(STATE.budget && STATE.budget.items && STATE.budget.items.length){
    return STATE.budget.items.map(it=>({category:it.category, budget:it.budget, memo:it.memo||''}));
  }
  const preferred = ['식비','교통/차량','주거/통신','쇼핑/문화','이벤트'];
  const cats = allFilterCats();
  const picked = preferred.filter(c=>cats.indexOf(c)>-1);
  return (picked.length?picked:cats.slice(0,5)).map(c=>({category:c, budget:'', memo:''}));
}
function budgetCategoryOptions(selected){
  const cats = allFilterCats();
  if(selected && cats.indexOf(selected)===-1) cats.unshift(selected);
  return cats.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
}
function setBudgetRefsFromRecommendation(rec){
  const refs={};
  (rec&&rec.items||[]).forEach(it=>{ refs[it.category]=it; });
  STATE.budgetRefs=refs;
}
function loadBudgetReferences(){
  return api('recommendBudget', STATE.ym, {months:3, roundUnit:10000, includeCategoriesWithoutHistory:true}).then(r=>{
    setBudgetRefsFromRecommendation(r);
    renderBudgetRows();
    return r;
  }).catch(()=>null);
}
function budgetRefLine(category){
  const r=STATE.budgetRefs && STATE.budgetRefs[category];
  if(!r) return '';
  return `<div class="budget-ref">
    <span>지난달 예산 ${r.lastBudget?fmt(r.lastBudget):'없음'}</span>
    <span>지난달 실제 ${fmt(r.lastMonthSpent||0)}</span>
    <span>3개월 평균 ${fmt(r.avgSpent||0)}</span>
    <span>이번 달 현재 ${fmt(r.currentSpent||0)}</span>
    <span>추천 ${fmt(r.recommended||0)}</span>
  </div>`;
}

function closeBudgetSheet(){

function renderBudgetRows(){
  const box=document.getElementById('budgetRows');

  box.innerHTML = STATE.budgetEditItems.map((it,i)=>`<div class="budget-row">
    <select data-i="${i}" data-k="category">${budgetCategoryOptions(it.category)}</select>
    <input data-i="${i}" data-k="budget" type="text" inputmode="numeric" value="${it.budget?comma(it.budget):''}" placeholder="예산">

      if(r.insight) STATE.insight=r.insight;

function txRow(t){

  const tags = [t.cat, mood!=='미지정'?mood:'', t.fixed && t.fixed!=='변동'? t.fixed:'', t.user].filter(Boolean)

      <div class="s">${tags}</div></div>

  </div>`;

function formatDateTitle(dateStr){
  if(!dateStr) return '날짜 미지정';
  const today = todayStr();
  const d = new Date(dateStr);
  if(dateStr === today) return '오늘';
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
  if(dateStr === yesterday.toISOString().slice(0,10)) return '어제';
  const days = ['일','월','화','수','목','금','토'];
  const dayName = isNaN(d.getDay()) ? '' : ' ' + days[d.getDay()] + '요일';
  const parts = dateStr.split('-');
  if(parts.length===3) return `${Number(parts[1])}월 ${Number(parts[2])}일${dayName}`;
  return dateStr;
}

function txGroupedRows(list){
  if(!list || !list.length) return '';
  const groups = {};
  const dates = [];
  list.forEach(t=>{
    const d = t.date || '기타';
    if(!groups[d]){ groups[d] = { rows:[], daySpent:0 }; dates.push(d); }
    groups[d].rows.push(t);
    if(t.type === '지출') groups[d].daySpent += Number(t.amount||0);
  });
  return dates.map(d=>{
    const g = groups[d];
    const header = `<div class="date-group-header">
      <span class="date-title">${formatDateTitle(d)}</span>
      <span class="date-total">${g.daySpent > 0 ? '지출 ' + comma(g.daySpent) + '원' : ''}</span>
    </div>`;
    const rowsHtml = g.rows.map(txRowDeletable).join('');
    return header + rowsHtml;
  }).join('');
}

function allFilterCats(){
  const seen={}, out=[];
  Object.keys(STATE.config.byType||{}).forEach(type=>{
    (STATE.config.byType[type]||[]).forEach(cat=>{
      if(!seen[cat]){ seen[cat]=true; out.push(cat); }
    });
  });
  return out;
}
function filterCats(){
  const type = STATE.list.type;
  const cats = type ? (STATE.config.byType[type]||[]) : allFilterCats();
  return cats.slice();
}
function filterOption(value, label, selected){
  return `<option value="${esc(value)}" ${String(selected)===String(value)?'selected':''}>${esc(label||value)}</option>`;
}
function hasActiveListFilters(){
  const l=STATE.list;
  return !!(
    String(l.query||'').trim() ||
    String(l.writer||'').trim() ||
    String(l.type||'').trim() ||
    String(l.category||'').trim() ||
    String(l.spendingMood||'').trim() ||
    String(l.minAmount||'').trim() ||
    String(l.maxAmount||'').trim()
  );
}
function syncListFiltersFromDom(){

function renderList(){

function txRowDeletable(t){
  const cls = txAmountClass(t);
  const sign = txAmountSign(t);
  const mood = normalizeMood(t.spendingMood || t.meaning || '미지정');
  const tags = [t.cat, mood!=='미지정'?mood:'', t.user].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');

    <button class="del" onclick="event.stopPropagation(); askDel(${t.row}, this)">🗑</button>
  </div>`;
}
function txTableRow(t){
  const cls = txAmountClass(t);
  const sign = txAmountSign(t);
  const desc = t.desc||t.cat||'(내역없음)';
  return `<tr data-row="${t.row}" onclick="openEdit(${t.row})">
    <td class="date-cell">${esc(t.date)}</td>
    <td class="user-cell">${esc(t.user||'-')}</td>
    <td class="type-cell"><span class="tx-type ${cls}">${esc(t.type||'-')}</span></td>
    <td class="cat-cell">${emo(t.cat)} ${esc(t.cat||'-')}</td>
    <td class="mood-cell">${esc(normalizeMood(t.spendingMood || t.meaning || '미지정'))}</td>
    <td class="desc-cell" title="${esc(desc)}">${esc(desc)}</td>
    <td class="amount-cell ${cls}">${sign}${comma(t.amount)}</td>
    <td class="delete-cell"><button class="del" onclick="event.stopPropagation(); askDel(${t.row}, this)" aria-label="거래 삭제">🗑</button></td>
  </tr>`;
}

  renderList();
}
function setListMode(mode){
  syncListFiltersFromDom();
  STATE.list.mode = mode;
  loadTransactions(false);
}
function searchTransactions(){
  syncListFiltersFromDom();
  loadTransactions(true);
}
function resetTransactions(){
  STATE.list.mode='recent';
  STATE.list.query='';
  STATE.list.writer='';
  STATE.list.type='';
  STATE.list.category='';
  STATE.list.spendingMood='';
  STATE.list.minAmount='';
  STATE.list.maxAmount='';
  renderList();
  loadTransactions(false);
}
function loadTransactions(showToast){
  syncListFiltersFromDom();
  return api('getTransactions', listRequestOptions()).then(r=>{
    STATE.list.rows = r.rows || [];
    STATE.list.count = r.count || STATE.list.rows.length;
    STATE.transactions = STATE.list.rows;
    renderList();
    if(showToast) toast(`${STATE.list.count}건 찾았어`);
    return r;
  }).catch(e=>toast(e.message||'내역을 불러오지 못했어', true));
}
function applyTxResult(r){
  STATE.trend=null;
  STATE.trendError='';
  if(r.ym && r.ym!==STATE.ym){
    STATE.ym=r.ym;
    document.getElementById('mLabel').textContent=STATE.ym;
  }
  if(r.summary) STATE.summary=r.summary;
  if(r.budget) STATE.budget=r.budget;
  if(r.recent) STATE.recent=r.recent;
  if(r.transactions) STATE.transactions=r.transactions;
  if(r.recurrings) STATE.recurrings=r.recurrings;
  if(r.recurringStatus) STATE.recurringStatus=r.recurringStatus;
  if(r.insight) STATE.insight=r.insight;
}
function refreshListAfterMutation(){
  if(!hasActiveListFilters()){
    if(STATE.list.mode==='recent'){
      STATE.list.rows = STATE.recent || [];
      STATE.list.count = STATE.list.rows.length;
    } else {
      STATE.list.rows = STATE.transactions || [];
      STATE.list.count = STATE.list.rows.length;
    }
    renderList();
    return Promise.resolve();
  }
  return loadTransactions(false);
}
function findTx(row){
  const all = [].concat(STATE.list.rows||[], STATE.recent||[], STATE.transactions||[]);
  return all.find(t=>Number(t.row)===Number(row));
}
function openEdit(row){
  const tx = findTx(row);
  if(!tx){ toast('거래를 다시 불러온 뒤 수정해줘', true); return; }
  openSheet(tx);
}
function openAnomaly(row){
  const tx = findTx(row);
  if(tx){ openSheet(tx); return; }
  toast('거래를 불러오는 중…');
  api('getTransactions', {ym:STATE.ym, mode:'month', limit:300}).then(r=>{
    STATE.transactions=r.rows||[];
    const found=findTx(row);
    if(found) openSheet(found);
    else toast('행 '+row+' 거래를 목록에서 찾지 못했어', true);
  }).catch(e=>toast(e.message||'거래를 불러오지 못했어', true));
}

function defaultRecurringForm(){
  const types = STATE.config.types || [];
  const type = types.indexOf('지출')>-1 ? '지출' : (types[0] || '지출');
  const cats = (STATE.config.byType && STATE.config.byType[type]) || [];
  return {id:'', name:'', type:type, cat:cats[0]||'', desc:'', amount:'', fixed:'고정', memo:'', user:'', day:1, enabled:true, lastRunYm:''};
}
function recurringCatOptions(type, selected){
  const cats = ((STATE.config.byType||{})[type]||[]).slice();
  if(selected && cats.indexOf(selected)===-1) cats.unshift(selected);
  return cats.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('');
}
function recurringTypeOptions(selected){
  const types = Array.from(new Set(['지출','수입','저축','대출상환'].concat(STATE.config.types||[])));
  return types.map(t=>`<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`).join('');
}
function recurringUserOptions(selected){
  return [
    ['','미지정'],['지수','지수'],['하콩','하콩']
  ].map(x=>`<option value="${esc(x[0])}" ${x[0]===selected?'selected':''}>${esc(x[1])}</option>`).join('');
}
function syncRecurringFormFromDom(){
  const g=id=>document.getElementById(id);
  if(!g('rName')) return;
  STATE.recurringForm = {
    id: g('rId').value,
    name: g('rName').value.trim(),
    type: g('rType').value,
    cat: g('rCat').value,
    desc: g('rDesc').value.trim(),
    amount: Number(g('rAmount').value.replace(/[^0-9]/g,''))||0,
    fixed: g('rFixed').value,
    memo: g('rMemo').value.trim(),
    user: g('rUser').value,
    day: Number(g('rDay').value)||1,
    enabled: g('rEnabled').checked,
    lastRunYm: g('rLastRunYm').value
  };
}

      <div class="filter-field"><label>금액</label><input id="rAmount" type="text" inputmode="numeric" value="${esc(amountText)}" placeholder="0" onfocus="this.value=this.value.replace(/,/g,'')" oninput="formatCommaInput(this)" onblur="formatCommaInput(this)"></div>

function renderRecurring(){
  const el=document.getElementById('v-recurring');
  if(!el) return;
  if(!STATE.recurringForm) STATE.recurringForm = defaultRecurringForm();
  const installed = !!(STATE.recurringStatus && STATE.recurringStatus.installed);
  const rows = STATE.recurrings || [];
  const rowHtml = rows.length ? rows.map(r=>{
    const off = r.enabled===false;
    return `<div class="recurring-item ${off?'off':''}">
      <div class="top">
        <div><div class="name">${esc(r.name||'(이름 없음)')} ${off?'<span class="tag">비활성</span>':''}</div>

    <div class="backup-actions">

    ${budgetManage}

    <div class="card recurring-status-card">

        <div>
          <div class="state">자동입력 ${installed?'켜짐':'꺼짐'}</div>
          <div class="hint">처음 자동화를 켤 때 Google 권한 승인이 필요할 수 있어. 승인 후 매일 새벽 6시에 오늘 결제일인 정기거래만 입력돼.</div>
          ${STATE.recurringStatus && STATE.recurringStatus.error ? `<div class="hint">상태 확인: ${esc(STATE.recurringStatus.error)}</div>` : ''}
        </div>
        <div class="recurring-actions">
          <button class="run" id="recRunBtn" onclick="runRecurringNowUi()">이번 달 지금 넣기</button>
          <button class="auto ${installed?'off':''}" id="recAutoBtn" onclick="toggleRecurringAutomation()">${installed?'자동입력 끄기':'자동입력 켜기'}</button>

    </section>
  </div>`;
  const backupBtn=document.getElementById('backupBtn');
  if(backupBtn) backupBtn.addEventListener('click', createBackup);
}
function newRecurring(){
  STATE.recurringForm = defaultRecurringForm();
  renderRecurring();
}
function recurringTypeChanged(value){
  syncRecurringFormFromDom();
  STATE.recurringForm.type = value;
  const cats = (STATE.config.byType||{})[value]||[];
  STATE.recurringForm.cat = cats[0] || '';
  renderRecurring();
}
function editRecurring(id){
  const r=(STATE.recurrings||[]).find(x=>x.id===id);
  if(!r){ toast('정기거래를 찾지 못했어', true); return; }
  STATE.recurringForm = {
    id:r.id, name:r.name||'', type:r.type||'지출', cat:r.cat||'', desc:r.desc||'', amount:r.amount||'',
    fixed:r.fixed||'고정', memo:r.memo||'', user:r.user||'', day:r.day||1, enabled:r.enabled!==false, lastRunYm:r.lastRunYm||''
  };
  renderRecurring();
  window.scrollTo(0,0);
}
function saveRecurringUi(){
  syncRecurringFormFromDom();
  const btn=document.getElementById('recSaveBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 저장 중…';
  api('saveRecurring', STATE.recurringForm).then(r=>{
    STATE.recurrings = r.rows || [];
    STATE.recurringStatus = r.status || STATE.recurringStatus;
    STATE.recurringForm = defaultRecurringForm();
    renderRecurring();
    toast('정기거래 저장 완료');
  }).catch(e=>{ btn.disabled=false; btn.textContent='저장'; toast(e.message||'정기거래를 저장하지 못했어', true); });
}
function disableRecurring(id){
  api('deleteRecurring', id).then(r=>{
    STATE.recurrings = r.rows || [];
    STATE.recurringStatus = r.status || STATE.recurringStatus;
    renderRecurring();
    toast('정기거래를 비활성화했어');
  }).catch(e=>toast(e.message||'비활성화하지 못했어', true));
}
function runRecurringNowUi(){
  const btn=document.getElementById('recRunBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner dark"></span> 입력 중…';
  api('runRecurringNow', STATE.ym).then(r=>{
    applyTxResult(r);
    STATE.recurrings = r.recurrings || STATE.recurrings;
    STATE.recurringStatus = r.recurringStatus || STATE.recurringStatus;
    renderHome();
    refreshListAfterMutation();
    renderRecurring();
    const msg = `${r.inserted||0}건 입력 / ${r.skipped||0}건은 이미 처리됨`;
    toast((r.errors&&r.errors.length) ? msg + ' · 일부 확인 필요' : msg, !!(r.errors&&r.errors.length));
  }).catch(e=>{ btn.disabled=false; btn.textContent='이번 달 지금 넣기'; toast(e.message||'정기거래를 넣지 못했어', true); });
}
function toggleRecurringAutomation(){
  const installed = !!(STATE.recurringStatus && STATE.recurringStatus.installed);
  const btn=document.getElementById('recAutoBtn');
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span>';
  api(installed?'removeRecurringTrigger':'installRecurringTrigger').then(r=>{
    STATE.recurringStatus = r || {installed:false};
    renderRecurring();
    toast(installed?'자동입력을 껐어':'자동입력을 켰어');
  }).catch(e=>{ btn.disabled=false; btn.textContent=installed?'자동입력 끄기':'자동입력 켜기'; toast(e.message||'자동화 설정을 바꾸지 못했어', true); });
}

function renderAsset(){
  const a=STATE.assets, el=document.getElementById('v-asset');

    const it=a.items[k]||{value:0}, m=ASSET_META[k];

      <div class="ico">${m.e}</div>
      <div class="nm">${m.n}<small>${m.h}</small></div>
      <input type="text" inputmode="numeric" data-k="${k}" value="${comma(it.value)}">

  el.innerHTML = `
    <div class="asset-layout">
      <section>
        <div class="sec-title">우리집 총자산</div>
        <div class="card asset-total-card">
          <div class="total-asset"><div class="l">💎 가정 총자산</div><div class="v" id="totalAsset">${fmt(a.total)}</div></div>

      </section>
      ${renderAssetTrendCard()}
      <section>

        <div class="card asset-card">
          <div class="asset-grid">${rows}</div>
          <div class="asset-actions"><button class="save-btn" id="assetSave">자산 저장하기</button></div>
          <div class="snapshot-tools">
            <input id="snapshotMemo" type="text" placeholder="스냅샷 메모 (선택)">

          </div>
        </div>
      </section>
      <section>
        <div class="sec-title">최근 자산 스냅샷</div>

      </section>
    </div>`;

  el.querySelectorAll('.assetrow input').forEach(inp=>{
    inp.addEventListener('input', ()=>{ formatCommaInput(inp); recalcTotal(); });

  });
  document.getElementById('assetSave').addEventListener('click', saveAssets);

function renderSnapshotList(){
  const snaps=STATE.assetSnapshots||[];
  if(!snaps.length) return `<div class="empty"><span class="e">📈</span>아직 저장된 스냅샷이 없어</div>`;
  return snaps.slice(0,6).map(s=>{
    const diff=Number(s.diff)||0;
    const diffCls=diff>0?'up':(diff<0?'down':'');
    const diffText=diff===0?'변동 없음':`${diff>0?'+':'-'}${comma(Math.abs(diff))}`;
    return `<div class="snapshot-row">
      <div class="meta"><div class="ym">${esc(s.ym||'-')}</div><div class="when">${esc(s.when||'')} ${s.memo?`· ${esc(s.memo)}`:''}</div></div>
      <div class="amt">${fmt(s.total)}<span class="diff ${diffCls}">${diffText}</span></div>
    </div>`;
  }).join('');
}
function recalcTotal(){
  const g=k=>{ const i=document.querySelector(`.assetrow input[data-k="${k}"]`); return i? Number(i.value.replace(/[^0-9]/g,''))||0:0; };
  const total=g('cash')+g('safe')+g('stock')+g('estate')+g('saving')-g('debt');
  document.getElementById('totalAsset').textContent=fmt(total);
}
function saveAssets(){
  const btn=document.getElementById('assetSave');
  const data={};
  document.querySelectorAll('.assetrow input').forEach(i=>{ data[i.dataset.k]=Number(i.value.replace(/[^0-9]/g,''))||0; });
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> 저장 중…';
  api('updateAssets', data).then(r=>{
    STATE.assets=r.assets; renderAsset(); toast('자산 업데이트 완료 💎');
  }).catch(e=>{ btn.disabled=false; btn.textContent='자산 저장하기'; toast(e.message||'저장하지 못했어', true); });
}
function saveSnapshot(){
  const btn=document.getElementById('snapshotSave');
  const memo=document.getElementById('snapshotMemo').value.trim();
  btn.disabled=true; btn.innerHTML='<span class="spinner dark"></span>';
  api('saveAssetSnapshot', STATE.ym, memo).then(r=>{
    STATE.assetSnapshots=r.snapshots||[];

    renderAsset();
    refreshHomeInsight();
    toast('자산 스냅샷 저장 완료');
  }).catch(e=>{ btn.disabled=false; btn.textContent='월말 스냅샷 저장'; toast(e.message||'스냅샷을 저장하지 못했어', true); });
}

function renderAnalysisAnomalies(){

function renderBackupCard(){

    ${result?`<div class="backup-result">${result}</div>`:''}

function loadMonthlyReview(force){
  if(STATE.monthlyReviewLoading) return;
  if(!force && STATE.monthlyReview && STATE.monthlyReview.ym===STATE.ym) return;
  STATE.monthlyReviewLoading=true;
  api('getMonthlyReview', STATE.ym).then(r=>{
    STATE.monthlyReviewLoading=false;
    STATE.monthlyReview=r;
    STATE.closeHistory=r.history || STATE.closeHistory || [];
    renderReview();
  }).catch(e=>{
    STATE.monthlyReviewLoading=false;
    STATE.monthlyReview={ym:STATE.ym,error:e.message||'월정리를 불러오지 못했어'};
    renderReview();
  });
}
function reviewValue(key){
  const latest=STATE.monthlyReview && STATE.monthlyReview.latest;
  return latest ? (latest[key] || '') : '';
}
function renderMeaningSummary(stats){
  const rows=(stats||[]).filter(it=>Number(it.amount)>0);
  if(!rows.length){

  const items=SPENDING_MOOD_OPTIONS.map(m=>rows.find(it=>it.meaning===m)).filter(Boolean);
  return `<div class="card">

      <div class="meaning-grid">${items.map(it=>`<div class="meaning-item">

function saveMonthlyReviewUi(){

    ym: STATE.ym,
    user: document.getElementById('reviewUser').value.trim(),
    memo: document.getElementById('reviewMemo').value.trim(),

  };
